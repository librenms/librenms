# Area rules are ordered by precedence. Each rule excludes files from higher-priority areas.
# Allow one topic and the independent device data request.
changed-files-labels-limit: 2

'Device :desktop_computer:':
  - changed-files:
      - any-glob-to-any-file: '{resources/definitions/os_{detection,discovery}/*.yaml,LibreNMS/OS/**}'

'Authentication':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{LibreNMS/Authentication/**,app/Http/Controllers/Auth/**}'
          - all-globs-to-all-files:
              - &not-device '!{resources/definitions/os_{detection,discovery}/*.yaml,LibreNMS/OS/**}'

'Alerting :bell:':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{LibreNMS/Alert{,ing}/**,app/{Http/Controllers,Models}/Alert*,resources/views/alert{,s}/**,html/images/transports/**,alerts.php}'
          - all-globs-to-all-files:
              - *not-device
              - &not-authentication '!{LibreNMS/Authentication/**,app/Http/Controllers/Auth/**}'

'Applications :floppy_disk:':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{LibreNMS/Applications/**,includes/{polling/applications,html/graphs/application}/**,resources/views/apps/**,resources/views/device/tabs/apps.blade.php,app/Http/Controllers/{Apps,Device/Tabs/Apps,Device/EditApplications}Controller.php}'
          - all-globs-to-all-files:
              - *not-device
              - *not-authentication
              - &not-alerting '!{LibreNMS/Alert{,ing}/**,app/{Http/Controllers,Models}/Alert*,resources/views/alert{,s}/**,html/images/transports/**,alerts.php}'

'API':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{app/Http/Controllers/Api/**,routes/api.php,includes/html/api_functions.inc.php,html/api_v0.php}'
          - all-globs-to-all-files:
              - *not-device
              - *not-authentication
              - *not-alerting
              - &not-applications '!{LibreNMS/Applications/**,includes/{polling/applications,html/graphs/application}/**,resources/views/apps/**,resources/views/device/tabs/apps.blade.php,app/Http/Controllers/{Apps,Device/Tabs/Apps,Device/EditApplications}Controller.php}'

'Graphs':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{LibreNMS/Data/Graphing/**,includes/html/graphs/**,html/graph.php,resources/views/graphs/**,app/Http/Controllers/{Graph,GraphData,GraphsPage,RealtimeGraph,Device/Tabs/Graphs}Controller.php}'
          - all-globs-to-all-files:
              - *not-device
              - *not-authentication
              - *not-alerting
              - *not-applications
              - &not-api '!{app/Http/Controllers/Api/**,routes/api.php,includes/html/api_functions.inc.php,html/api_v0.php}'

'WebUI':
  - all:
      - changed-files:
          - any-glob-to-any-file: '{app/{Http/Controllers,View}/**,html/{css,js}/**,includes/html/{pages,forms,table}/**,resources/{css,js,views}/**,routes/web.php}'
          # The action requires a single glob to match every file.
          - any-glob-to-all-files: '{app/{Http/{Controllers,Middleware},Models,Policies,View}/**,html/{build,css,js}/**,includes/html/{pages,forms,table}/**,resources/{css,js,views}/**,routes/web.php,database/{factories,migrations}/**,{doc,lang,tests}/**}'
          - all-globs-to-all-files:
              - *not-authentication
              - *not-alerting
              - *not-applications
              - *not-api
              - '!{LibreNMS/Data/Graphing/**,includes/html/graphs/**,html/graph.php,resources/views/graphs/**,app/Http/Controllers/{Graph,GraphData,GraphsPage,RealtimeGraph,Device/Tabs/Graphs}Controller.php}'

# Match these labels only on PRs dedicated to that kind of change.
'Documentation :book:':
  - all:
      - changed-files:
          - any-glob-to-any-file: &docs '{doc/**,mkdocs.yml}'
          - any-glob-to-all-files: *docs

'Translation':
  - all:
      - changed-files:
          - any-glob-to-any-file: &translation 'lang/**'
          - any-glob-to-all-files: *translation

'Tests :test_tube:':
  - all:
      - changed-files:
          - any-glob-to-any-file: &tests '{tests/**,database/factories/**,phpunit.xml}'
          - any-glob-to-all-files: *tests

'CI':
  - all:
      - changed-files:
          - any-glob-to-any-file: &ci '.github/{actions,linters,workflows}/**'
          - any-glob-to-all-files: *ci

'Dependencies':
  - all:
      - changed-files:
          - any-glob-to-any-file: &dependencies '{composer.json,composer.lock,package.json,package-lock.json,requirements.txt}'
          - any-glob-to-all-files: *dependencies

'MIBs':
  - all:
      - changed-files:
          - any-glob-to-any-file: &mibs 'mibs/**'
          - any-glob-to-all-files: *mibs

# Maintainers decide when a device change is adequately covered.
'Needs Device Data :unicorn:':
  - all:
      - changed-files:
          - any-glob-to-any-file: 'resources/definitions/os_{detection,discovery}/*.yaml'
          - all-globs-to-all-files: '!tests/{data,snmpsim}/**'
