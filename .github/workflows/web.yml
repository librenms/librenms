name: Web

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  dusk-php:
    runs-on: ubuntu-latest
    steps:
      - name: Start Database
        id: database
        background: true
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`librenms_phpunit_78hunjuybybh\` character set UTF8mb4 collate utf8mb4_bin;"

      # the runner image ships a chromedriver matching its Chrome
      - name: Start Chrome Driver
        id: chromedriver
        background: true
        run: |
          # detach output, the step would wait for it to close
          nohup "$CHROMEWEBDRIVER/chromedriver" --port=9515 > /tmp/chromedriver.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9515/status > /dev/null; do sleep 0.2; done'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/
            !/doc/

      - name: Init env
        run: |
          cat > .env <<EOL
          APP_KEY=
          APP_URL=http://127.0.0.1:8000
          APP_ENV=testing
          APP_DEBUG=true
          DB_HOST=127.0.0.1
          DB_DATABASE=librenms_phpunit_78hunjuybybh
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_TEST_HOST=127.0.0.1
          DB_TEST_DATABASE=librenms_phpunit_78hunjuybybh
          DB_TEST_USERNAME=root
          DB_TEST_PASSWORD=root
          MAIL_MAILER=log
          EOL

      - name: Setup SQLite
        run: sqlite3 database/testing.sqlite ""

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Wait for Database
        wait: database

      - name: Migrate Database
        run: php artisan migrate --database=testing

      - name: Run Laravel Server
        run: |
          nohup php artisan serve --no-reload > /tmp/serve.log 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 0.2; done'

      - name: Wait for Chrome Driver
        wait: chromedriver

      - name: Run Dusk Tests
        run: php artisan dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: tests/Browser/console

      - name: Upload LibreNMS Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: librenms-logs
          path: logs/librenms.log
