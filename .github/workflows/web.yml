name: Web

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  dusk-php:
    runs-on: ubuntu-latest
    steps:
      - name: Start Database
        id: database
        background: true
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`librenms_phpunit_78hunjuybybh\` character set UTF8mb4 collate utf8mb4_bin;"

      # the runner image ships a chromedriver matching its Chrome
      - name: Start Chrome Driver
        id: chromedriver
        background: true
        run: |
          # detach output, the step would wait for it to close
          nohup "$CHROMEWEBDRIVER/chromedriver" --port=9515 > /tmp/chromedriver.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:9515/status > /dev/null; do sleep 0.2; done'

      # start checkout last, it can fail reading the event payload while other steps start
      - parallel:
          # checkout empties the workspace and composer.lock is not there yet, so
          # restore the newest vendor cache by prefix, composer-install brings it up to date
          - name: Restore vendor
            id: composer-restore
            uses: actions/cache/restore@v6
            with:
              path: ~/vendor
              key: ${{ runner.os }}-vendor-
              restore-keys: ${{ runner.os }}-vendor-

          - name: Checkout
            uses: actions/checkout@v7
            with:
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/

      - name: Init env
        run: |
          cat > .env <<EOL
          APP_KEY=
          APP_URL=http://127.0.0.1:8000
          APP_ENV=testing
          APP_DEBUG=true
          DB_HOST=127.0.0.1
          DB_DATABASE=librenms_phpunit_78hunjuybybh
          DB_USERNAME=root
          DB_PASSWORD=root
          DB_TEST_HOST=127.0.0.1
          DB_TEST_DATABASE=librenms_phpunit_78hunjuybybh
          DB_TEST_USERNAME=root
          DB_TEST_PASSWORD=root
          MAIL_MAILER=log
          EOL

      - name: Setup SQLite
        run: sqlite3 database/testing.sqlite ""

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install
        with:
          cache-matched-key: ${{ steps.composer-restore.outputs.cache-matched-key }}
          scripts: true

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Wait for Database
        wait: database

      - name: Migrate Database
        run: php artisan migrate --database=testing

      - name: Run Laravel Server
        run: |
          nohup php artisan serve --no-reload > /tmp/serve.log 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8000; do sleep 0.2; done'

      - name: Wait for Chrome Driver
        wait: chromedriver

      - name: Run Dusk Tests
        run: php artisan dusk

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/Browser/screenshots

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: tests/Browser/console

      - name: Upload LibreNMS Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: librenms-logs
          path: logs/librenms.log
