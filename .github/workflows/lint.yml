name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    permissions:
      contents: read # to fetch code (actions/checkout)
      statuses: write # to mark the status of each individual linter run

    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/tests/data/
            !/tests/snmpsim/
            !/mibs/

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          VALIDATE_BASH: true
          VALIDATE_PYTHON_PYLINT: true
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpstan:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "Main", file: "phpstan.neon" }
          - { name: "Legacy", file: "phpstan-legacy.neon" }
          - { name: "Deprecated", file: "phpstan-deprecated.neon" }

    steps:
      # start checkout last, it can fail reading the event payload while other steps start
      - parallel:
          # checkout empties the workspace and composer.lock is not there yet, so
          # restore the newest vendor cache by prefix, composer-install brings it up to date
          - name: Restore vendor
            id: composer-restore
            uses: actions/cache/restore@v6
            with:
              path: ~/vendor
              key: ${{ runner.os }}-vendor-
              restore-keys: ${{ runner.os }}-vendor-

          - name: Checkout Code
            uses: actions/checkout@v7
            with:
              fetch-depth: 2
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install
        with:
          cache-matched-key: ${{ steps.composer-restore.outputs.cache-matched-key }}

      - name: Find new PHP files
        if: github.event_name == 'pull_request' && matrix.config.name == 'Main'
        id: new-php-files
        run: |
          # HEAD is the PR merge commit, HEAD~1 is its first parent (base branch tip)
          NEW_PHP_FILES=$(git diff -z --diff-filter=A --name-only HEAD~1 HEAD -- 'app/**.php' 'bootstrap/**.php' 'config/**.php' 'database/**.php' 'LibreNMS/**.php' 'resources/**.php' 'routes/**.php' 'tests/**.php' | xargs -0)
          echo "Discovered new PHP files: $NEW_PHP_FILES"
          echo "files=$NEW_PHP_FILES" >> "$GITHUB_OUTPUT"

      - name: Run PHPStan (New files, level 6)
        if: github.event_name == 'pull_request' && matrix.config.name == 'Main' && steps.new-php-files.outputs.files != ''
        env:
          NEW_PHP_FILES: ${{ steps.new-php-files.outputs.files }}
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --level=6 -- $NEW_PHP_FILES

      - name: Run PHPStan (${{ matrix.config.name }})
        run: ./vendor/bin/phpstan analyze --no-interaction --memory-limit=4G --configuration=${{ matrix.config.file }}

  rector:
    name: Rector (dry-run)
    runs-on: ubuntu-latest

    steps:
      # start checkout last, it can fail reading the event payload while other steps start
      - parallel:
          # checkout empties the workspace and composer.lock is not there yet, so
          # restore the newest vendor cache by prefix, composer-install brings it up to date
          - name: Restore vendor
            id: composer-restore
            uses: actions/cache/restore@v6
            with:
              path: ~/vendor
              key: ${{ runner.os }}-vendor-
              restore-keys: ${{ runner.os }}-vendor-

          - name: Checkout Code
            uses: actions/checkout@v7
            with:
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install
        with:
          cache-matched-key: ${{ steps.composer-restore.outputs.cache-matched-key }}

      - name: Run Rector (dry-run)
        run: ./vendor/bin/rector process --dry-run --no-progress-bar --ansi --memory-limit=1G

  pint:
    name: Pint (dry-run)
    runs-on: ubuntu-latest

    steps:
      # start checkout last, it can fail reading the event payload while other steps start
      - parallel:
          # checkout empties the workspace and composer.lock is not there yet, so
          # restore the newest vendor cache by prefix, composer-install brings it up to date
          - name: Restore vendor
            id: composer-restore
            uses: actions/cache/restore@v6
            with:
              path: ~/vendor
              key: ${{ runner.os }}-vendor-
              restore-keys: ${{ runner.os }}-vendor-

          - name: Checkout Code
            uses: actions/checkout@v7
            with:
              sparse-checkout-cone-mode: false
              sparse-checkout: |
                /*
                !/tests/data/
                !/tests/snmpsim/
                !/mibs/
                !/doc/

      - name: Install PHP dependencies
        uses: ./.github/actions/composer-install
        with:
          cache-matched-key: ${{ steps.composer-restore.outputs.cache-matched-key }}
          dump-autoload: false

      - name: Run Pint (dry-run)
        run: ./vendor/bin/pint --test --parallel
