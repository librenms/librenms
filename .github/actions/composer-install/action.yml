name: 'Composer Install'
description: 'Install PHP dependencies using Composer including caching'

inputs:
  dump-autoload:
    description: 'Generate the Composer autoloader'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Get composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache composer cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Cache vendor directory
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-vendor-

    - name: Composer install
      shell: bash
      run: composer install --prefer-dist --no-interaction --no-progress --no-scripts --no-autoloader

    - name: Composer dump-autoload
      if: inputs.dump-autoload == 'true'
      shell: bash
      run: composer dump --strict-psr --strict-ambiguous --no-interaction --no-scripts
