modules:
  os:
    hardware: STORMSHIELD-PROPERTY-MIB::snsModel.0
    version: 
      - STORMSHIELD-PROPERTY-MIB::snsVersion.0
      - STORMSHIELD-PROPERTY-MIB::snsBiosVersion.0
    version_template: '{{ STORMSHIELD-PROPERTY-MIB::snsVersion.0 }} {{ STORMSHIELD-PROPERTY-MIB::snsBiosVersion.0 }}'    
    serial: STORMSHIELD-PROPERTY-MIB::snsSerialNumber.0
    sysName: STORMSHIELD-PROPERTY-MIB::snsSystemName.0
    features: STORMSHIELD-PROPERTY-MIB::snsSystemNodeName.0
    
  sensors:
    temperature:
      data:
        -
          oid: STORMSHIELD-SYSTEM-MONITOR-MIB::snsCpuTable
          value: STORMSHIELD-SYSTEM-MONITOR-MIB::snsCpuTemp
          num_oid: '.1.3.6.1.4.1.11256.1.10.7.1.2.{{ $index }}'
          descr: 'CPU Temperature {{ $index }}'
          index: 'snsCpuTemp.{{ $index }}'
    fanspeed:
      data:
        -
          oid: STORMSHIELD-SYSTEM-MONITOR-MIB::snsFanTable
          value: STORMSHIELD-SYSTEM-MONITOR-MIB::snsFanRpm
          num_oid: '.1.3.6.1.4.1.11256.1.10.9.1.4.{{ $index }}'
          descr: 'Fan {{ $index }} Speed'
          index: 'snsFanRpm.{{ $index }}'
    state:
      data:
        -
          oid: STORMSHIELD-SYSTEM-MONITOR-MIB::snsPowerSupplyTable
          value: STORMSHIELD-SYSTEM-MONITOR-MIB::snsPowerSupplyPowered
          num_oid: '.1.3.6.1.4.1.11256.1.10.6.1.2.{{ $index }}'
          descr: 'Power Supply {{ $index }}'
          index: 'snsPowerSupplyPowered.{{ $index }}'
          state_name: snsPowerSupplyPowered
          states:
            - { descr: 'Powered',   value: 1, generic: 0 }
            - { descr: 'Unpowered', value: 2, generic: 2 }
        -
          oid: STORMSHIELD-SYSTEM-MONITOR-MIB::snsPowerSupplyTable
          value: STORMSHIELD-SYSTEM-MONITOR-MIB::snsPowerSupplyStatus
          num_oid: '.1.3.6.1.4.1.11256.1.10.6.1.3.{{ $index }}'
          descr: 'Power Supply {{ $index }} Status'
          index: 'snsPowerSupplyStatus.{{ $index }}'
          state_name: snsPowerSupplyStatus
          states:
            - { descr: 'Warning', value: 0, generic: 2 }
            - { descr: 'OK',      value: 1, generic: 0 }
        -
          oid: STORMSHIELD-SYSTEM-MONITOR-MIB::snsDiskTable
          value: STORMSHIELD-SYSTEM-MONITOR-MIB::snsDiskEntrySmartResult
          num_oid: '.1.3.6.1.4.1.11256.1.10.5.1.3.{{ $index }}'
          descr: 'Disk {{ $index }} {{ STORMSHIELD-SYSTEM-MONITOR-MIB::snsDiskEntryDiskName }} {{ STORMSHIELD-SYSTEM-MONITOR-MIB::snsDiskEntryRaidStatus }}'
          index: 'snsDiskEntrySmartResult.{{ $index }}'
          state_name: snsDiskEntrySmartResult
          states:
            - { descr: 'SMART Warning', value: 0, generic: 2 }
            - { descr: 'PASSED',        value: 1, generic: 0 }
        -
          oid: STORMSHIELD-HEALTH-MONITOR-MIB::snsFirewallHealthTable
          value: STORMSHIELD-HEALTH-MONITOR-MIB::snsHaModeHealth
          num_oid: '.1.3.6.1.4.1.11256.1.16.2.1.3.{{ $index }}'
          descr: 'Ha Mode'
          group: 'Global System Health Firewall {{ STORMSHIELD-HEALTH-MONITOR-MIB::snsSerialHealth }}'
          index: 'snsHaModeHealth.{{ $index }}'
          state_name: snsHaModeHealth
          states:
            - { descr: 'None',    value: 0, generic: 3 }
            - { descr: 'Active',  value: 1, generic: 0 }
            - { descr: 'Passive', value: 2, generic: 3 }
        -
          oid: STORMSHIELD-HEALTH-MONITOR-MIB::snsFirewallHealthTable
          value: STORMSHIELD-HEALTH-MONITOR-MIB::snsHaLinkHealth
          num_oid: '.1.3.6.1.4.1.11256.1.16.2.1.4.{{ $index }}'
          descr: 'Ha Link'
          group: 'Global System Health Firewall {{ STORMSHIELD-HEALTH-MONITOR-MIB::snsSerialHealth }}'
          index: 'snsHaLinkHealth.{{ $index }}'
          state_name: snsHaLinkHealth
          states:
            - { descr: 'Good',  value: 0, generic: 0 }
            - { descr: 'Minor', value: 1, generic: 1 }
            - { descr: 'Major', value: 2, generic: 2 }
        -
          oid: STORMSHIELD-HEALTH-MONITOR-MIB::snsFirewallHealthTable
          value: STORMSHIELD-HEALTH-MONITOR-MIB::snsPowerSupplyHealth
          num_oid: '.1.3.6.1.4.1.11256.1.16.2.1.5.{{ $index }}'
          descr: 'Power Supply'
          group: 'Global System Health Firewall {{ STORMSHIELD-HEALTH-MONITOR-MIB::snsSerialHealth }}'
          index: 'snsPowerSupplyHealth.{{ $index }}'
          state_name: snsPowerSupplyHealth
          states:
            - { descr: 'Good',  value: 0, generic: 0 }
            - { descr: 'Minor', value: 1, generic: 1 }
            - { descr: 'Major', value: 2, generic: 2 }
        -
          oid: STORMSHIELD-HEALTH-MONITOR-MIB::snsFirewallHealthTable
          value: STORMSHIELD-HEALTH-MONITOR-MIB::snsFanHealth
          num_oid: '.1.3.6.1.4.1.11256.1.16.2.1.6.{{ $index }}'
          descr: 'Fans'
          group: 'Global System Health Firewall {{ STORMSHIELD-HEALTH-MONITOR-MIB::snsSerialHealth }}'
          index: 'snsFanHealth.{{ $index }}'
          state_name: snsFanHealth
          states:
            - { descr: 'Good',  value: 0, generic: 0 }
            - { descr: 'Minor', value: 1, generic: 1 }
            - { descr: 'Major', value: 2, generic: 2 }
        -
