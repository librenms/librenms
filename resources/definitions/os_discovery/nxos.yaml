modules:
    os:
        version: 'ENTITY-MIB::entPhysicalSoftwareRev.22'
        hardware: 'ENTITY-MIB::entPhysicalName.149'
        serial: 'ENTITY-MIB::entPhysicalSerialNum.10'
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - ENTITY-MIB::entPhysicalName
        state:
            data:
                -
                    oid: CISCO-ENTITY-FRU-CONTROL-MIB::cefcFanTrayOperStatus
                    num_oid: '.1.3.6.1.4.1.9.9.117.1.4.1.1.1.{{ $index }}'
                    descr: '{{ ENTITY-MIB::entPhysicalName }}'
                    index: '{{ $index }}'
                    state_name: cefcFanTrayOperStatus
                    states:
                        - { value: 1, generic: 3, descr: unknown }
                        - { value: 2, generic: 0, descr: up }
                        - { value: 3, generic: 2, descr: down }
                        - { value: 4, generic: 1, descr: warning }
