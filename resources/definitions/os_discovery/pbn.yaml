modules:
    os:
        sysDescr_regex: '/Software\s+(?<hardware>.*) Series Software, Version (?<version>[^,]+), .*Serial num:(?<serial>[^,]+),/s'
    processors:
        data:
            -
                oid: NMS-PROCESS-MIB::nmspmCPUTotal5min
                num_oid: '.1.3.6.1.4.1.11606.10.9.109.1.1.1.1.5.{{ $index }}'
                index: 0
                type: pbn-cpu
                skip_values:
                    -
                        oid: index
                        op: '!='
                        value: 1
    mempools:
        data:
            -
                total: NMS-MEMORY-POOL-MIB::nmsMemoryPoolTotalMemorySize
                percent_used: NMS-MEMORY-POOL-MIB::nmsMemoryPoolUtilization
                type: pbn-mem
                descr: 'Main Memory'
