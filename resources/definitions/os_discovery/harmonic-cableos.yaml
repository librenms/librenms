modules:
    os:
        sysDescr_regex: '/COS Software,\s*Released Version\s+(?<version>[^\s]+)/i'
    sensors:
        state:
            data:
                -   oid: HARMONIC-DOCS-EXT-MIB::hrmCmtsRpdTable
                    value: hrmCmtsRpdOperStatus
                    num_oid: '.1.3.6.1.4.1.1563.10.2.3.116.1.7.1.1.3.{{ $index }}'
                    descr: 'RPD {{ hrmCmtsRpdMacAddr }}'
                    group: Remote PHY Devices
                    state_name: hrmCmtsRpdOperStatus
                    user_func: 'LibreNMS\OS\HarmonicCableos::rpdOperationalState'
                    states:
                        - { value: -1, generic: 3, descr: Unknown }
                        - { value: 0, generic: 2, descr: Offline }
                        - { value: 1, generic: 1, descr: Identifying }
                        - { value: 2, generic: 1, descr: Configuring }
                        - { value: 3, generic: 0, descr: Online }
                        - { value: 4, generic: 2, descr: Identification failed }
                        - { value: 5, generic: 2, descr: Configuration failed }
                        - { value: 6, generic: 1, descr: Discovered }
