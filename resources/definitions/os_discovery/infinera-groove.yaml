modules:
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - CORIANT-GROOVE-MIB::portId
                        - CORIANT-GROOVE-MIB::ochOsAdminStatus

        power:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Power Consumption'
                    value: CORIANT-GROOVE-MIB::systemPowerConsumptionCurrent
                    num_oid: '.1.3.6.1.4.1.42229.1.2.2.2.2.{{ $index }}'

        temperature:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Inlet'
                    value: CORIANT-GROOVE-MIB::shelfInletTemperature
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.1.1.1.3.{{ $index }}'
                    index: 'shelfInletTemperature.{{ $index }}'
                    skip_values: -99
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Outlet'
                    value: CORIANT-GROOVE-MIB::shelfOutletTemperature
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.1.1.1.4.{{ $index }}'
                    index: 'shelfOutletTemperature.{{ $index }}'
                    skip_values: -99
        dbm:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::portTable
                    value: CORIANT-GROOVE-MIB::portRxOpticalPower
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.6.1.1.4.{{ $index }}'
                    descr: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} Port Receive Power'
                    group: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }}'
                    index: 'portRxOpticalPower.{{ $index }}'
                    skip_values:
                        -
                            oid: CORIANT-GROOVE-MIB::ochOsAdminStatus
                            op: exists
                            value: false
                        -
                            oid: CORIANT-GROOVE-MIB::portAdminStatus
                            op: not_in_array
                            value: [1, 3]
                -
                    oid: CORIANT-GROOVE-MIB::portTable
                    value: CORIANT-GROOVE-MIB::portRxOpticalPower
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.6.1.1.4.{{ $index }}'
                    descr: 'port-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} Port Receive Power'
                    group: 'port-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }}'
                    index: 'portRxOpticalPower.{{ $index }}'
                    skip_values:
                        -
                            oid: CORIANT-GROOVE-MIB::ochOsAdminStatus
                            op: exists
                            value: true
                        -
                            oid: CORIANT-GROOVE-MIB::portAdminStatus
                            op: not_in_array
                            value: [1, 3]
                -
                    oid: CORIANT-GROOVE-MIB::portTable
                    value: CORIANT-GROOVE-MIB::portTxOpticalPower
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.6.1.1.5.{{ $index }}'
                    descr: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} Port Transmit Power'
                    group: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }}'
                    index: 'portTxOpticalPower.{{ $index }}'
                    skip_values:
                        -
                            oid: CORIANT-GROOVE-MIB::ochOsAdminStatus
                            op: exists
                            value: false
                        -
                            oid: CORIANT-GROOVE-MIB::portAdminStatus
                            op: not_in_array
                            value: [1, 3]
                -
                    oid: CORIANT-GROOVE-MIB::portTable
                    value: CORIANT-GROOVE-MIB::portTxOpticalPower
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.6.1.1.5.{{ $index }}'
                    descr: 'port-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} Port Transmit Power'
                    group: 'port-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }}'
                    index: 'portTxOpticalPower.{{ $index }}'
                    skip_values:
                        -
                            oid: CORIANT-GROOVE-MIB::ochOsAdminStatus
                            op: exists
                            value: true
                        -
                            oid: CORIANT-GROOVE-MIB::portAdminStatus
                            op: not_in_array
                            value: [1, 3]
