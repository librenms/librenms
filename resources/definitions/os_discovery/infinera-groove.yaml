modules:
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - CORIANT-GROOVE-MIB::portId

        power:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Power Consumption'
                    value: CORIANT-GROOVE-MIB::systemPowerConsumptionCurrent
                    num_oid: '.1.3.6.1.4.1.42229.1.2.2.2.2.{{ $index }}'

        temperature:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Inlet'
                    value: CORIANT-GROOVE-MIB::shelfInletTemperature
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.1.1.1.3.{{ $index }}'
                    index: 'shelfInletTemperature.{{ $index }}'
                    skip_values: -99
                -
                    oid: CORIANT-GROOVE-MIB::shelfTable
                    descr: 'Chassis Outlet'
                    value: CORIANT-GROOVE-MIB::shelfOutletTemperature
                    num_oid: '.1.3.6.1.4.1.42229.1.2.3.1.1.1.4.{{ $index }}'
                    index: 'shelfOutletTemperature.{{ $index }}'
                    skip_values: -99
        chromatic_dispersion:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::ochOsTable
                    value: CORIANT-GROOVE-MIB::ochOsCD
                    num_oid: '.1.3.6.1.4.1.42229.1.2.4.1.19.1.1.23.{{ $index }}'
                    descr: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} CD'
                    index: 'ochOsCD.{{ $index }}'
                    skip_values: -99
        snr:
            data:
                -
                    oid: CORIANT-GROOVE-MIB::ochOsTable
                    value: CORIANT-GROOVE-MIB::ochOsOSNR
                    num_oid: '.1.3.6.1.4.1.42229.1.2.4.1.19.1.1.24.{{ $index }}'
                    descr: 'och-os-{{ $subindex0 }}/{{ $subindex1 }}/{{ $subindex3 }} Optical SNR'
                    index: 'ochOsOSNR.{{ $index }}'
                    skip_values: -99
