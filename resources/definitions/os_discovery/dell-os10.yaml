modules:
    bgp-peers:
        peers:
            -
                index_layout: [vrf, address]
                remote_as: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerRemoteAs
                local_as: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerLocalAs
                state: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerState
                admin_status: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerAdminStatus
                local_address: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerLocalAddr
                descr: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerDescription
                last_error_code: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerLastErrorCodeReceived
                last_error_subcode: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerLastErrorSubCodeReceived
                last_error_text: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerLastErrorReceivedText
                established_time: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerFsmEstablishedTime
                update_elapsed_time: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerInUpdatesElapsedTime
                in_updates: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerInUpdates
                out_updates: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerOutUpdates
                in_messages: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerInTotalMessages
                out_messages: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PeerOutTotalMessages
        address_families:
            -
                index_layout: [vrf, address, afi, safi]
                accepted: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PrefixInPrefixesAccepted
                advertised: DELLEMC-OS10-BGP4V2-MIB::os10bgp4V2PrefixOutPrefixes
    os:
        hardware: DELLEMC-OS10-CHASSIS-MIB::os10ChassisType.1
        version: DELLEMC-OS10-CHASSIS-MIB::os10ChassisHwRev.1
        serial: DELLEMC-OS10-CHASSIS-MIB::os10ChassisProductSN.1
        features:
            - DELLEMC-OS10-CHASSIS-MIB::os10ChassisServiceTag.1
            - DELLEMC-OS10-CHASSIS-MIB::os10ChassisExpServiceCode.1
        features_template: '{{ DELLEMC-OS10-CHASSIS-MIB::os10ChassisServiceTag.1 }}/{{ DELLEMC-OS10-CHASSIS-MIB::os10ChassisExpServiceCode.1 }}'
    sensors:
        temperature:
            data:
                -
                    oid: DELLEMC-OS10-CHASSIS-MIB::os10ChassisTable
                    value: DELLEMC-OS10-CHASSIS-MIB::os10ChassisTemp
                    num_oid: '.1.3.6.1.4.1.674.11000.5000.100.4.1.1.3.1.11.{{ $index }}'
                    descr: 'Chassis {{ $index }}'
                -
                    oid: DELLEMC-OS10-CHASSIS-MIB::os10CardTable
                    value: DELLEMC-OS10-CHASSIS-MIB::os10CardTemp
                    num_oid: '.1.3.6.1.4.1.674.11000.5000.100.4.1.1.4.1.5.{{ $index }}'
                    descr: 'Card {{ $index }}'
        state:
            data:
                -
                    oid: DELLEMC-OS10-CHASSIS-MIB::os10FanTable
                    value: DELLEMC-OS10-CHASSIS-MIB::os10FanOperStatus
                    num_oid: '.1.3.6.1.4.1.674.11000.5000.100.4.1.2.3.1.7.{{ $index }}'
                    descr: 'Fan {{ $index }}'
                    group: Fans
                    state_name: os10FanOperStatus
                    states:
                        - { value: 1, descr: normal, generic: 0 }
                        - { value: 2, descr: abnormal, generic: 2 }
                -
                    oid: DELLEMC-OS10-CHASSIS-MIB::os10FanTrayTable
                    value: DELLEMC-OS10-CHASSIS-MIB::os10FanTrayOperStatus
                    num_oid: '.1.3.6.1.4.1.674.11000.5000.100.4.1.2.2.1.4.{{ $index }}'
                    descr: 'Fan Tray {{ $index }}'
                    group: Fans
                    state_name: os10FanTrayOperStatus
                    states:
                        - { value: 1, descr: normal, generic: 0 }
                        - { value: 2, descr: abnormal, generic: 2 }
                -
                    oid: DELLEMC-OS10-CHASSIS-MIB::os10PowerSupplyTable
                    value: DELLEMC-OS10-CHASSIS-MIB::os10PowerSupplyOperStatus
                    num_oid: '.1.3.6.1.4.1.674.11000.5000.100.4.1.2.1.1.4.{{ $index }}'
                    descr: 'PSU {{ $index }}'
                    group: PSUs
                    state_name: os10PowerSupplyOperStatus
                    states:
                        - { value: 1, descr: up, generic: 0 }
                        - { value: 2, descr: down, generic: 2 }
                        - { value: 3, descr: testing, generic: 1 }
                        - { value: 4, descr: unknown, generic: 3 }
                        - { value: 5, descr: dormant, generic: 1 }
                        - { value: 6, descr: notPresent, generic: 2 }
                        - { value: 7, descr: lowerLayerDown, generic: 2 }
                        - { value: 8, descr: failed, generic: 2 }
