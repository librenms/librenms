modules:
    os:
        hardware:
            - EATON-EPDU-MIB::partNumber.0
            - PDU-MIB::objectName.0
        hardware_template: '{{ EATON-EPDU-MIB::partNumber.0 }} {{ PDU-MIB::objectName.0 }}'
        serial:
            - EATON-EPDU-MIB::serialNumber.0
            - PDU-MIB::serialNumber.0
        version:
            - EATON-EPDU-MIB::firmwareVersion.0
            - PDU-MIB::firmwareVersion.0
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - EATON-EPDU-MIB::temperatureScale
                        - EATON-EPDU-MIB::inputPhaseDesignator
                        - EATON-EPDU-MIB::inputCurrentThUpperWarning
                        - EATON-EPDU-MIB::inputCurrentThUpperCritical
                        - EATON-EPDU-MIB::groupName
                        - EATON-EPDU-MIB::groupCurrentThUpperWarning
                        - EATON-EPDU-MIB::groupCurrentThUpperCritical
                        - EATON-EPDU-MIB::outletName
                        - EATON-EPDU-MIB::outletDesignator
                        - EATON-EPDU-MIB::outletCurrentThUpperWarning
                        - EATON-EPDU-MIB::outletCurrentThUpperCritical
                        - EATON-EPDU-MIB::outletControlSwitchable
                        - EATON-EPDU-MIB::temperatureName
                        - EATON-EPDU-MIB::temperatureProbeStatus
                        - EATON-EPDU-MIB::humidityName
                        - EATON-EPDU-MIB::humidityProbeStatus
        power:
            data:
                -
                    oid: EATON-EPDU-MIB::inputWatts
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.3.4.1.4.{{ $index }}'
                    descr: 'Unit {{ $subindex0 }} Input Feed {{ EATON-EPDU-MIB::inputPhaseDesignator }}'
                    index: 'inputWatts.{{ $index }}'
                -
                    oid: EATON-EPDU-MIB::outletWatts
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.6.5.1.3.{{ $index }}'
                    descr: 'Unit {{ $subindex0 }} Outlet {{ EATON-EPDU-MIB::outletDesignator }}: {{ EATON-EPDU-MIB::outletName }}'
                    index: 'outletWatts.{{ $index }}'
        current:
            data:
                -
                    oid: EATON-EPDU-MIB::inputCurrent
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.3.3.1.4.{{ $index }}'
                    divisor: 1000
                    descr: 'Unit {{ $subindex0 }} Input Feed {{ EATON-EPDU-MIB::inputPhaseDesignator }}'
                    index: 'inputCurrent.{{ $index }}'
                    high_limit: EATON-EPDU-MIB::inputCurrentThUpperCritical
                    warn_limit: EATON-EPDU-MIB::inputCurrentThUpperWarning
                -
                    oid: EATON-EPDU-MIB::groupCurrent
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.5.4.1.3.{{ $index }}'
                    divisor: 1000
                    descr: 'Unit {{ $subindex0 }} {{ EATON-EPDU-MIB::groupName }}'
                    index: 'groupCurrent.{{ $index }}'
                    high_limit: EATON-EPDU-MIB::groupCurrentThUpperCritical
                    warn_limit: EATON-EPDU-MIB::groupCurrentThUpperWarning
                -
                    oid: EATON-EPDU-MIB::outletCurrent
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.6.4.1.3.{{ $index }}'
                    divisor: 1000
                    descr: 'Unit {{ $subindex0 }} Outlet {{ EATON-EPDU-MIB::outletDesignator }}: {{ EATON-EPDU-MIB::outletName }}'
                    index: 'outletCurrent.{{ $index }}'
                    high_limit: EATON-EPDU-MIB::outletCurrentThUpperCritical
                    warn_limit: EATON-EPDU-MIB::outletCurrentThUpperWarning
        voltage:
            data:
                -
                    oid: EATON-EPDU-MIB::inputVoltage
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.3.2.1.3.{{ $index }}'
                    divisor: 1000
                    descr: 'Unit {{ $subindex0 }} Input Feed {{ EATON-EPDU-MIB::inputPhaseDesignator }}'
                    index: 'inputVoltage.{{ $index }}'
        temperature:
            data:
                -
                    oid: EATON-EPDU-MIB::temperatureValue
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.7.1.1.4.{{ $index }}'
                    divisor: 10
                    descr: 'Unit {{ $subindex0 }} {{ EATON-EPDU-MIB::temperatureName }}'
                    index: 'temperatureValue.{{ $index }}'
                    skip_values:
                        - { oid: EATON-EPDU-MIB::temperatureProbeStatus, op: '!=', value: 1 }
                        - { oid: 'EATON-EPDU-MIB::temperatureScale:0', op: '!=', value: 0 }
                -
                    oid: EATON-EPDU-MIB::temperatureValue
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.7.1.1.4.{{ $index }}'
                    divisor: 10
                    user_func: fahrenheit_to_celsius
                    descr: 'Unit {{ $subindex0 }} {{ EATON-EPDU-MIB::temperatureName }}'
                    index: 'temperatureValue.{{ $index }}'
                    skip_values:
                        - { oid: EATON-EPDU-MIB::temperatureProbeStatus, op: '!=', value: 1 }
                        - { oid: 'EATON-EPDU-MIB::temperatureScale:0', op: '!=', value: 1 }
        humidity:
            data:
                -
                    oid: EATON-EPDU-MIB::humidityValue
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.7.2.1.4.{{ $index }}'
                    divisor: 10
                    descr: 'Unit {{ $subindex0 }} {{ EATON-EPDU-MIB::humidityName }}'
                    index: 'humidityValue.{{ $index }}'
                    skip_values:
                        - { oid: EATON-EPDU-MIB::humidityProbeStatus, op: '!=', value: 1 }
        state:
            data:
                -
                    oid: EATON-EPDU-MIB::outletControlStatus
                    num_oid: '.1.3.6.1.4.1.534.6.6.7.6.6.1.2.{{ $index }}'
                    descr: 'Unit {{ $subindex0 }} Outlet {{ EATON-EPDU-MIB::outletDesignator }}: {{ EATON-EPDU-MIB::outletName }}'
                    index: 'outletControlStatus.{{ $index }}'
                    state_name: outletControlStatus
                    skip_values:
                        - { oid: EATON-EPDU-MIB::outletControlSwitchable, op: '=', value: 2 }
                    states:
                        - { value: 0, generic: 1, descr: 'off' }
                        - { value: 1, generic: 0, descr: 'on' }
                        - { value: 2, generic: 1, descr: pendingOff }
                        - { value: 3, generic: 1, descr: pendingOn }
