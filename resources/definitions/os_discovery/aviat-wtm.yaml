modules:
    os:
        hardware: ENTITY-MIB::entPhysicalModelName.2
        serial: ENTITY-MIB::entPhysicalSerialNum.2
        version: ENTITY-MIB::entPhysicalSoftwareRev.2
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - ENTITY-MIB::entPhysicalName

        state:
            data:
                -
                    oid: AVIAT-MODEM-MIB::aviatModemCurModulationRx
                    value: AVIAT-MODEM-MIB::aviatModemCurModulationRx
                    num_oid: '.1.3.6.1.4.1.2509.9.3.2.1.1.14.{{ $index }}'
                    descr: 'RX Modulation ({{ ENTITY-MIB::entPhysicalName }})'
                    index: '{{ $index }}'
                    state_name: aviatModemCurModulationRx
                    states:
                        - { value: 1, generic: 3, descr: 'N/A' }
                        - { value: 2, generic: 2, descr: 'QPSK' }
                        - { value: 3, generic: 1, descr: '16-QAM' }
                        - { value: 4, generic: 0, descr: '32-QAM' }
                        - { value: 5, generic: 0, descr: '64-QAM' }
                        - { value: 6, generic: 0, descr: '128-QAM' }
                        - { value: 7, generic: 0, descr: '256-QAM' }
                        - { value: 8, generic: 0, descr: '512-QAM' }
                        - { value: 9, generic: 0, descr: '1024-QAM' }
                        - { value: 10, generic: 0, descr: '256-QAM-HG' }
                        - { value: 11, generic: 0, descr: '512-QAM-HG' }
                        - { value: 12, generic: 0, descr: '1024-QAM-HG' }
                        - { value: 13, generic: 0, descr: '2048-QAM' }
                        - { value: 14, generic: 0, descr: '4096-QAM' }
                        - { value: 15, generic: 2, descr: 'Quarter-QPSK' }
                        - { value: 16, generic: 2, descr: 'Half-QPSK' }

                -
                    oid: AVIAT-MODEM-MIB::aviatModemCurModulationTx
                    value: AVIAT-MODEM-MIB::aviatModemCurModulationTx
                    num_oid: '.1.3.6.1.4.1.2509.9.3.2.1.1.13.{{ $index }}'
                    descr: 'TX Modulation ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatModemCurModulationTx.{{ $index }}'
                    state_name: aviatModemCurModulationTx
                    states:
                        - { value: 1, generic: 3, descr: 'N/A' }
                        - { value: 2, generic: 2, descr: 'QPSK' }
                        - { value: 3, generic: 1, descr: '16-QAM' }
                        - { value: 4, generic: 0, descr: '32-QAM' }
                        - { value: 5, generic: 0, descr: '64-QAM' }
                        - { value: 6, generic: 0, descr: '128-QAM' }
                        - { value: 7, generic: 0, descr: '256-QAM' }
                        - { value: 8, generic: 0, descr: '512-QAM' }
                        - { value: 9, generic: 0, descr: '1024-QAM' }
                        - { value: 10, generic: 0, descr: '256-QAM-HG' }
                        - { value: 11, generic: 0, descr: '512-QAM-HG' }
                        - { value: 12, generic: 0, descr: '1024-QAM-HG' }
                        - { value: 13, generic: 0, descr: '2048-QAM' }
                        - { value: 14, generic: 0, descr: '4096-QAM' }
                        - { value: 15, generic: 2, descr: 'Quarter-QPSK' }
                        - { value: 16, generic: 2, descr: 'Half-QPSK' }

                -
                    oid: AVIAT-MODEM-MIB::aviatModemStatusOper
                    value: AVIAT-MODEM-MIB::aviatModemStatusOper
                    num_oid: '.1.3.6.1.4.1.2509.9.3.2.4.1.3.{{ $index }}'
                    descr: 'Radio Link ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatModemStatusOper.{{ $index }}'
                    state_name: aviatModemStatusOper
                    states:
                        - { value: 1, generic: 0, descr: 'Up' }
                        - { value: 2, generic: 2, descr: 'Down' }
                        - { value: 3, generic: 1, descr: 'Testing' }
                        - { value: 4, generic: 3, descr: 'Unknown' }
                        - { value: 5, generic: 1, descr: 'Dormant' }
                        - { value: 6, generic: 3, descr: 'Not Present' }
                        - { value: 7, generic: 2, descr: 'Lower Layer Down' }

        count:
            data:
                -
                    oid: AVIAT-G826-MIB::aviatG826ErroredSeconds
                    value: AVIAT-G826-MIB::aviatG826ErroredSeconds
                    num_oid: '.1.3.6.1.4.1.2509.9.14.2.2.1.4.{{ $index }}'
                    descr: 'ES cumulative ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatG826ErroredSeconds.{{ $index }}'
                -
                    oid: AVIAT-G826-MIB::aviatG826SeverelyErroredSeconds
                    value: AVIAT-G826-MIB::aviatG826SeverelyErroredSeconds
                    num_oid: '.1.3.6.1.4.1.2509.9.14.2.2.1.6.{{ $index }}'
                    descr: 'SES cumulative ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatG826SeverelyErroredSeconds.{{ $index }}'
                -
                    oid: AVIAT-G826-MIB::aviatG826BackgroundBlockErrors
                    value: AVIAT-G826-MIB::aviatG826BackgroundBlockErrors
                    num_oid: '.1.3.6.1.4.1.2509.9.14.2.2.1.8.{{ $index }}'
                    descr: 'BBE cumulative ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatG826BackgroundBlockErrors.{{ $index }}'
                -
                    oid: AVIAT-G826-MIB::aviatG826UnavailableSeconds
                    value: AVIAT-G826-MIB::aviatG826UnavailableSeconds
                    num_oid: '.1.3.6.1.4.1.2509.9.14.2.2.1.11.{{ $index }}'
                    descr: 'UAS cumulative ({{ ENTITY-MIB::entPhysicalName }})'
                    index: 'aviatG826UnavailableSeconds.{{ $index }}'

                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.2.{{ $index }}'
                    descr: 'Alarms Critical - total'
                    index: 'aviatIetfAlarmTotal.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 3 }
                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.3.{{ $index }}'
                    descr: 'Alarms Critical - cleared'
                    index: 'aviatIetfAlarmCleared.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 3 }
                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.2.{{ $index }}'
                    descr: 'Alarms Major - total'
                    index: 'aviatIetfAlarmTotal.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 4 }
                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.3.{{ $index }}'
                    descr: 'Alarms Major - cleared'
                    index: 'aviatIetfAlarmCleared.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 4 }
                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryTotalAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.2.{{ $index }}'
                    descr: 'Alarms Minor - total'
                    index: 'aviatIetfAlarmTotal.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 5 }
                -
                    oid: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    value: AVIAT-IETF-ALARMS-MIB::aviatIetfAlarmSummaryClearedAlarms
                    num_oid: '.1.3.6.1.4.1.2509.9.49.2.1.3.2.1.3.{{ $index }}'
                    descr: 'Alarms Minor - cleared'
                    index: 'aviatIetfAlarmCleared.{{ $index }}'
                    skip_values:
                        - { oid: index, op: '!=', value: 5 }
