modules:
    os:
        sysDescr_regex: '/(?<version>\d+\.\d\S+)/'
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - WHISP-APS-MIB::cbrsEnable
        temperature:
            data:
                -
                    oid: WHISP-BOX-MIBV2-MIB::boxTemperatureC
                    num_oid: '.1.3.6.1.4.1.161.19.3.3.1.35.{{ $index }}'
                    index: 0
                    descr: 'Cambium Temperature'
        state:
            data:
                -
                    oid: WHISP-APS-MIB::whispGPSStats
                    num_oid: '.1.3.6.1.4.1.161.19.3.1.3.1.{{ $index }}'
                    index: 0
                    descr: GPS Status
                    states:
                        - { value: 1, generic: 0, descr: gpsSynchronized }
                        - { value: 2, generic: 2, descr: gpsLostSync }
                        - { value: 3, generic: 0, descr: generatingSync }
                -
                    oid: WHISP-APS-MIB::apCbsdStatus
                    num_oid: '.1.3.6.1.4.1.161.19.3.1.14.2.1.{{ $index }}'
                    state_name: apCbsdStatus
                    descr: 'AP CBSD SAS Grant Status'
                    skip_values:
                        -
                            oid: WHISP-APS-MIB::cbrsEnable.0
                            op: '!='
                            value: 1
                    states:
                        - { value: 0, generic: 2, descr: Unregistered }
                        - { value: 1, generic: 1, descr: Registering }
                        - { value: 2, generic: 0, descr: Registered }
                        - { value: 3, generic: 1, descr: Grant }
                        - { value: 4, generic: 0, descr: Authorized }
                        - { value: 5, generic: 1, descr: Grant Suspended }
                        - { value: 6, generic: 2, descr: Grant Terminate }
                        - { value: 7, generic: 1, descr: Relinquishing Spectrum }
                        - { value: 8, generic: 1, descr: Relinquished Spectrum }
                        - { value: 9, generic: 1, descr: Deregistering }
                        - { value: 10, generic: 2, descr: Deregistered }
                        - { value: 11, generic: 3, descr: Unknown }
        dbm:
            data:
                -
                    oid: WHISP-APS-MIB::apCbsdEirpGranted
                    num_oid: '.1.3.6.1.4.1.161.19.3.1.14.2.9.{{ $index }}'
                    descr: 'AP CBSD SAS Granted EIRP'
                    skip_values:
                        -
                            oid: WHISP-APS-MIB::cbrsEnable.0
                            op: '!='
                            value: 1
