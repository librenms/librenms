modules:
  os:
    version: systemFirmware.0

  sensors:
    state:
      data:
        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsOutletsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsOutletStateInt
          num_oid: '.1.3.6.1.4.1.46501.5.3.1.10.{{ $index }}'
          descr: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsOutletName
          index: 'DIDACTUM-SYSTEM-MIB::ctlInternalSensorsOutletId.{{ $index }}'
          state_name: didactumInternalOutlet
          group: Internal Sensors
          states:
            - { value: 0, generic: 3, descr: unknown }
            - { value: 5, generic: 0, descr: on }
            - { value: 6, generic: 0, descr: off }
            - { value: 7, generic: 3, descr: not-connected }
            - { value: 8, generic: 0, descr: pulse }

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsDiscretsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsDiscretStateInt
          num_oid: '.1.3.6.1.4.1.46501.5.1.1.12.{{ $index }}'
          descr: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsDiscretName
          index: 'DIDACTUM-SYSTEM-MIB::ctlInternalSensorsDiscretId.{{ $index }}'
          state_name: didactumInternalDiscreteSensor
          group: Internal Sensors
          states:
            - { value: 0, generic: 3, descr: unknown }
            - { value: 1, generic: 0, descr: normal }
            - { value: 4, generic: 2, descr: alarm }
            - { value: 7, generic: 3, descr: not-connected }

    temperature:
      data:
        -
          oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.3.5.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogName }}"
          index: "virtual.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogType
              op: not_regex
              value: '/temperature|temp/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.5.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogName }}"
          index: "internal.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogType
              op: not_regex
              value: '/temperature|temp/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.6.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogName }}"
          index: "can.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogType
              op: not_regex
              value: '/temperature|temp/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.7.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogName }}"
          index: "lora.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogType
              op: not_regex
              value: '/temperature|temp/i'

    humidity:
      data:
        -
          oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.3.5.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogName }}"
          index: "virtual.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogType
              op: not_regex
              value: '/humidity/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.5.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogName }}"
          index: "internal.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogType
              op: not_regex
              value: '/humidity/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.6.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogName }}"
          index: "can.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogType
              op: not_regex
              value: '/humidity/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.7.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogName }}"
          index: "lora.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogType
              op: not_regex
              value: '/humidity/i'

    voltage:
      data:
        -
          oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.3.5.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogName }}"
          index: "virtual.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogType
              op: not_regex
              value: '/voltage/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.5.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogName }}"
          index: "internal.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogType
              op: not_regex
              value: '/voltage/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.6.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogName }}"
          index: "can.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogType
              op: not_regex
              value: '/voltage/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.7.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogName }}"
          index: "lora.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogType
              op: not_regex
              value: '/voltage/i'

    percent:
      data:
        -
          oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.3.5.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogName }}"
          index: "virtual.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlVirtualDevicesAnalogType
              op: not_regex
              value: '/percent|percentage|%/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.5.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogName }}"
          index: "internal.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlInternalSensorsAnalogType
              op: not_regex
              value: '/percent|percentage|%/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.6.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogName }}"
          index: "can.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlCANSensorsAnalogType
              op: not_regex
              value: '/percent|percentage|%/i'

        -
          oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogsTable
          value: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogValueInt
          num_oid: '.1.3.6.1.4.1.46501.7.2.1.25.{{ $index }}'
          divisor: 100
          descr: "{{ DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogName }}"
          index: "lora.{{ $index }}"
          skip_values:
            - oid: DIDACTUM-SYSTEM-MIB::ctlLoRaSensorsAnalogType
              op: not_regex
              value: '/percent|percentage|%/i'
