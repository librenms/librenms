modules:
    os:
        hardware:
            - ENTITY-MIB::entPhysicalName.1
            - ENTITY-MIB::entPhysicalHardwareRev.1
        hardware_template: '{{ ENTITY-MIB::entPhysicalName.1 }} {{ ENTITY-MIB::entPhysicalHardwareRev.1 }}'
        serial: ENTITY-MIB::entPhysicalSerialNum.1
        version: ENTITY-MIB::entPhysicalSoftwareRev.1
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - CM-FACILITY-MIB::cmEthernetTrafficPortIndex
                        - CM-ENTITY-MIB::slotCardUnitName
                        - CM-ENTITY-MIB::slotIndex
        state:
            data:
                -
                    oid: CM-ALARM-MIB::cmSysCondTable
                    value: CM-ALARM-MIB::cmSysCondType
                    num_oid: '.1.3.6.1.4.1.2544.1.12.6.1.3.1.3.{{ $index }}'
                    descr: 'Alarm(s) : {{ $index }}'
                    group: Alarm Condition
                    index: 'cmSysCondType.{{ $index }}'
                    state_name: cmSysCondType
                    states:
                        - { value: 9,   generic: 3, descr: 'Primary NTP Server Failed' }
                        - { value: 10,   generic: 3, descr: 'Secondary NTP Server Failed' }
                        - { value: 27,  generic: 2, descr: 'Equipment Fault' }
                        - { value: 34,  generic: 2, descr: 'PSU A Failed' }
                        - { value: 35,  generic: 2, descr: 'PSU B Failed' }
                        - { value: 53,  generic: 2, descr: 'SFP Mismatch' }
                        - { value: 59,  generic: 2, descr: 'Over Temperature' }
                        - { value: 60,  generic: 2, descr: 'Under Temperature' }
                        - { value: 65,  generic: 2, descr: 'Input Power Fault' }
                        - { value: 86,  generic: 3, descr: 'SNMP Dying Gasp - Host Unreachable' }
                        - { value: 90,  generic: 3, descr: 'SFP Non Qualified' }
                        - { value: 93,  generic: 2, descr: 'Power No Input Unit Fault' }
                        - { value: 121, generic: 1, descr: 'XFP Mismatch' }
                        - { value: 122, generic: 3, descr: 'XFP Non Qualified' }
                        - { value: 125, generic: 2, descr: 'LAG Member Failed' }
                        - { value: 135, generic: 2, descr: 'DB Corruption' }
                        - { value: 284, generic: 1, descr: 'XFP Wavelength Mismatch' }
                        - { value: 288, generic: 3, descr: 'Loopback Active' }
                        - { value: 347, generic: 2, descr: 'Key Exchange Failed' }
                        - { value: 348, generic: 2, descr: 'Key Exchange Auth Password Missing' }
                        - { value: 389, generic: 2, descr: 'Power No Input 2' }
                        - { value: 390, generic: 2, descr: 'Key Exchange Stop' }
                        - { value: 403, generic: 3, descr: 'HTTPS SSL Certificate Expired' }
                        - { value: 409, generic: 2, descr: 'Fan Fail' }
                        - { value: 417, generic: 2, descr: 'PSU A Input Fail' }
                        - { value: 418, generic: 3, descr: 'PSU B Input Fail' }
                        
                -
                    oid: F3-ERP-MIB::f3ErpGroupTable
                    value: F3-ERP-MIB::f3ErpGroupNodeState
                    num_oid: '.1.3.6.1.4.1.2544.1.12.25.1.1.1.24.{{ $index }}'
                    descr: 'Node {{ $index }} State: {{ F3-ERP-MIB::f3ErpGroupUserLabel }}'
                    group: ERP Status
                    index: 'f3ErpGroupNodeState.{{ $index }}'
                    state_name: f3ErpGroupNodeState
                    states:
                        - { value: 1, generic: 0, descr: 'IDLE' }
                        - { value: 2, generic: 2, descr: 'PROTECTION' }
                        - { value: 3, generic: 1, descr: 'MANUAL' }
                        - { value: 4, generic: 3, descr: 'FORCED' }
                        - { value: 5, generic: 1, descr: 'PENDING' }
                        
                -
                    oid: F3-ERP-MIB::f3ErpUnitTable
                    value: F3-ERP-MIB::f3ErpUnitPortRole
                    num_oid: '.1.3.6.1.4.1.2544.1.12.25.1.3.1.4.{{ $index }}'
                    descr: 'Port: {{ $subindex2 }}'
                    group: ERP Node State
                    index: 'f3ErpUnitPortRole.{{ $index }}'
                    state_name: f3ErpUnitPortRole
                    states:
                        - { value: 1, generic: 0, descr: 'NONE' }
                        - { value: 2, generic: 0, descr: 'NEIGHBOR' }
                        - { value: 3, generic: 0, descr: 'RPL OWNER' }

                -
                    oid: F3-ERP-MIB::f3ErpUnitTable
                    value: F3-ERP-MIB::f3ErpUnitPortStatus
                    num_oid: '.1.3.6.1.4.1.2544.1.12.25.1.3.1.5.{{ $index }}'
                    descr: 'Port: {{ $subindex2 }}'
                    group: ERP Port Status
                    index: 'f3ErpUnitPortStatus.{{ $index }}'
                    state_name: f3ErpUnitPortStatus
                    states:
                        - { value: 1,  generic: 0, descr: 'unblocked' }
                        - { value: 4,  generic: 0, descr: 'blocked RPL' }
                        - { value: 9,  generic: 1, descr: 'blocked pending' }
                        - { value: 10, generic: 3, descr: 'subring interconnect' }
                -
                    oid: CM-ENTITY-MIB::psuTable
                    value: CM-ENTITY-MIB::psuAdminState
                    num_oid: '.1.3.6.1.4.1.2544.1.12.3.1.4.1.3.{{ $index }}'
                    descr: '{{ CM-ENTITY-MIB::psuType }} psu {{ $subindex2 }} Admin State'
                    group: Psu  id {{ $subindex2 }}
                    snmp_flags: ['-OQUb']
                    index: 'CM-ENTITY-MIB::psuAdminState.{{ $index }}'
                    state_name: psuAdminState
                    states:
                        - { value: 1, generic: 0, descr: 'in-service' }
                        - { value: 2, generic: 0, descr: 'management' }
                        - { value: 3, generic: 0, descr: 'maintenance' }
                        - { value: 4, generic: 2, descr: 'disabled' }
                        - { value: 5, generic: 1, descr: 'unassigned' }
                -
                    oid: CM-ENTITY-MIB::psuTable
                    value: CM-ENTITY-MIB::psuOperationalState
                    num_oid: '.1.3.6.1.4.1.2544.1.12.3.1.4.1.3.{{ $index }}'
                    descr: '{{ CM-ENTITY-MIB::psuType }} psu {{ $subindex2 }} Oper State'
                    group: Psu  id {{ $subindex2 }}
                    snmp_flags: ['-OQUb']
                    index: 'CM-ENTITY-MIB::psuOperationalState.{{ $index }}'
                    state_name: psuOperationalState
                    states:
                        - { value: 1, generic: 0, descr: 'normal' }
                        - { value: 2, generic: 2, descr: 'outage' }
                -
                    oid: CM-ENTITY-MIB::fanTable
                    value: CM-ENTITY-MIB::fanAdminState
                    num_oid: '.1.3.6.1.4.1.2544.1.12.3.1.4.1.3.{{ $index }}'
                    descr: 'fan Admin State'
                    group: Fan
                    index: 'CM-ENTITY-MIB::fanAdminState.{{ $index }}'
                    state_name: fanAdminState
                    states:
                        - { value: 1, generic: 0, descr: 'in-service' }
                        - { value: 2, generic: 0, descr: 'management' }
                        - { value: 3, generic: 0, descr: 'maintenance' }
                        - { value: 4, generic: 2, descr: 'disabled' }
                        - { value: 5, generic: 1, descr: 'unassigned' }
                -
                    oid: CM-ENTITY-MIB::fanTable
                    value: CM-ENTITY-MIB::fanOperationalState
                    num_oid: '.1.3.6.1.4.1.2544.1.12.3.1.4.1.3.{{ $index }}'
                    descr: 'fan Oper State'
                    group: Fan
                    index: 'CM-ENTITY-MIB::fanOperationalState.{{ $index }}'
                    state_name: fanOperationalState
                    states:
                        - { value: 1, generic: 0, descr: 'normal' }
                        - { value: 2, generic: 2, descr: 'outage' }
