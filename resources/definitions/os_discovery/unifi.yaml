modules:
    os:
        sysDescr_regex: '/^Ubiquiti UniFi (?<hardware>UCG-\S+)\s+(?<version>\d\S*)/'
    mempools:
        data:
            -
                total: FROGFOOT-RESOURCES-MIB::memTotal
                free: FROGFOOT-RESOURCES-MIB::memFree
                precision: 1024
    sensors:
        temperature:
            data:
                -
                    oid: LM-SENSORS-MIB::lmTempSensorsTable
                    value: LM-SENSORS-MIB::lmTempSensorsValue
                    num_oid: '.1.3.6.1.4.1.2021.13.16.2.1.3.{{ $index }}'
                    descr: '{{ LM-SENSORS-MIB::lmTempSensorsDevice }}'
                    divisor: 1000
