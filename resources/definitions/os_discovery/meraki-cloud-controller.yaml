modules:
    os:
        hardware: MERAKI-CLOUD-CONTROLLER-MIB::organizationName.0
    sensors:
        state:
            data:
                -
                    oid: MERAKI-CLOUD-CONTROLLER-MIB::devTable
                    value: MERAKI-CLOUD-CONTROLLER-MIB::devStatus
                    num_oid: '.1.3.6.1.4.1.29671.1.1.4.1.3.{{ $index }}'
                    descr: '{{ MERAKI-CLOUD-CONTROLLER-MIB::devName }}'
                    index: 'devStatus.{{ $index }}'
                    group: 'Device Status'
                    state_name: merakiDevStatus
                    states:
                        - { value: 0, generic: 2, descr: offline }
                        - { value: 1, generic: 0, descr: online }
