modules:
    os:
        sysDescr_regex: '/^(?<hardware>.+?) (?<version>\d+(?:\.\d+)+\S*)/'
    sensors:
        additional_oids:
            data:
                -
                    oid: ANUE-MIB::anueFilterName
                -
                    oid: ANUE-MIB::anueFilterType
        percent:
            data:
                -
                    oid: ANUE-MIB::anueFilterCurHCUtil
                    value: ANUE-MIB::anueFilterCurHCUtil
                    num_oid: '.1.3.6.1.4.1.32620.1.1.3.7.1.10.{{ $index }}'
                    descr: '{{ ANUE-MIB::anueFilterName }}'
                    index: 'anueFilterCurHCUtil.{{ $index }}'
                    group: 'Port Utilization'
                    skip_values:
                        -
                            oid: ANUE-MIB::anueFilterType
                            op: 'not_in_array'
                            value: [1, 2, 4, 5]
