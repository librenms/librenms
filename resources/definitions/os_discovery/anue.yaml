modules:
    os:
        sysDescr_regex: '/^(?<hardware>\S+ \S+) (?<version>\S+)/'
    sensors:
        percent:
            data:
                -
                    oid: ANUE-MIB::anueNtoFilterStatsCurHCTable
                    value: ANUE-MIB::anueFilterCurHCUtil
                    num_oid: '.1.3.6.1.4.1.32620.1.1.3.7.1.10.{{ $index }}'
                    descr: '{{ ANUE-MIB::anueFilterDefaultName }}'
                    index: 'anueFilterCurHCUtil.{{ $index }}'
                    group: 'Port Utilization'
