modules:
    mempools:
        data:
            -
                total: F10-CHASSIS-MIB::chSysProcessorMemSize
                percent_used: F10-CHASSIS-MIB::chRpmMemUsageUtil
            -
                total: F10-S-SERIES-CHASSIS-MIB::chSysProcessorMemSize
                percent_used: F10-S-SERIES-CHASSIS-MIB::chStackUnitMemUsageUtil
            -
                total: F10-C-SERIES-CHASSIS-MIB::chSysProcessorMemSize
                percent_used: F10-C-SERIES-CHASSIS-MIB::chSysProcessorMemSize
            -
                total: F10-M-SERIES-CHASSIS-MIB::chSysProcessorMemSize
                percent_used: F10-M-SERIES-CHASSIS-MIB::chSysProcessorMemSize
            -
                total: F10-Z-SERIES-CHASSIS-MIB::chSysProcessorMemSize
                percent_used: F10-Z-SERIES-CHASSIS-MIB::chSysCpuUtilMemUsage
    os:
        sysDescr_regex: '/Application Software Version: (?<version>[\d.]+\d)/'
    processors:
        data:
            -
                oid: F10-S-SERIES-CHASSIS-MIB::chStackUnitCpuUtil5Sec
                num_oid: '.1.3.6.1.4.1.6027.3.10.1.2.9.1.2.{{ $index }}'
                descr: 'Stack Unit {{ $index }} CPU'
            -
                oid: F10-C-SERIES-CHASSIS-MIB::chRpmCpuUtil5Sec
                num_oid: '.1.3.6.1.4.1.6027.3.8.1.3.7.1.3.{{ $index }}'
                descr: 'Route Process Module {{ $index }} CPU'
                type: ftos-rpm
            -
                oid: F10-C-SERIES-CHASSIS-MIB::chLineCardCpuUtil5Sec
                num_oid: '.1.3.6.1.4.1.6027.3.8.1.5.1.1.1.{{ $index }}'
                descr: 'Line Card {{ $index }} CPU'
            -
                oid: F10-M-SERIES-CHASSIS-MIB::chStackUnitCpuUtil5Sec
                num_oid: '.1.3.6.1.4.1.6027.3.19.1.2.8.1.2.{{ $index }}'
                descr: 'Stack Unit {{ $index }} CPU'
            -
                oid: F10-Z-SERIES-CHASSIS-MIB::chSysCpuUtil5Sec
                num_oid: '.1.3.6.1.4.1.6027.3.25.1.2.3.1.1.{{ $index }}'
                descr: 'Chassis {{ $index }} CPU'
