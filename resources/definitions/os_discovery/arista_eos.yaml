modules:
    os:
        sysDescr_regex: '/ version (?<version>.+) running on .+ (?<hardware>\S+)$/'
        serial: ENTITY-MIB::entPhysicalSerialNum.1
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - ENTITY-MIB::entPhysicalDescr
                        - ENTITY-MIB::entPhysicalClass
        state:
            data:
                -
                    oid: ENTITY-STATE-MIB::entStateTable
                    value: ENTITY-STATE-MIB::entStateOper
                    num_oid: '.1.3.6.1.2.1.131.1.1.1.3.{{ $index }}'
                    descr: '{{ ENTITY-MIB::entPhysicalDescr }}'
                    state_name: ENTITY-STATE-MIB::EntityOperState
                    states:
                        - { descr: unknown, value: 1, generic: 3 }
                        - { descr: disabled, value: 2, generic: 2 }
                        - { descr: enabled, value: 3, generic: 0 }
                        - { descr: testing, value: 4, generic: 1 }
                    skip_values:
                        -
                            oid: ENTITY-MIB::entPhysicalClass
                            op: not_in_array
                            value: [6, 7]
