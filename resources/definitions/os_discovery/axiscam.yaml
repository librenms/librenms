modules:
    mempools:
        data:
            -
                used: AXIS-VIDEO-MIB::deviceMemoryUsed.0
                total: AXIS-VIDEO-MIB::deviceMemoryTotal.0
                descr: 'System Memory'
                precision: 1024
    os:
        sysDescr_regex: '/(?<hardware>[^;]+); [^;]+; (?<version>[^;]+)/'
        serial:
            - IF-MIB::ifPhysAddress.2
    processors:
        data:
            -
                oid: AXIS-VIDEO-MIB::deviceCpuUtilization
                num_oid: '.1.3.6.1.4.1.368.4.1.100.3.1.{{ $index }}'
                index: 0
                descr: 'CPU'
    sensors:
        state:
            data:
                -
                    oid: AXIS-VIDEO-MIB::tempSensorTable
                    value: AXIS-VIDEO-MIB::tempSensorStatus
                    num_oid: '.1.3.6.1.4.1.368.4.1.3.1.3.{{ $index }}'
                    index: '{{ $subindex1 }}'
                    descr: 'Temperature Sensor {{ $subindex1 }}'
                    entPhysicalIndex: '{{ $subindex1 }}'
                    skip_values:
                        - { oid: index, op: not_starts, value: '1.' } # only tempSensorType common(1)
                    state_name: tempSensorStatusState
                    states:
                        - { value: 1, generic: 0, descr: Normal }
                        - { value: 2, generic: 2, descr: Failed }
                        - { value: 3, generic: 2, descr: Out Of Boundary }
                -
                    oid: AXIS-VIDEO-MIB::storageTable
                    value: AXIS-VIDEO-MIB::storageDisruptionDetected
                    num_oid: '.1.3.6.1.4.1.368.4.1.8.1.3.{{ $index }}'
                    descr: 'Storage Status: {{ $AXIS-VIDEO-MIB::storageName }}'
                    entPhysicalIndex: '{{ $index }}'
                    state_name: storageDisruptionDetectedState
                    states:
                        - { value: 1, generic: 0, descr: Normal }
                        - { value: 2, generic: 2, descr: Failed }
