modules:
    os:
        sysDescr_regex: '/ radio;(?<hardware>.*) v(?<version>[0-9.]*);.*;SN: (?<serial>[0-9]+);/'
        hardware: SAF-FREEMILE60-MIB::deviceModel.0
        serial: SAF-FREEMILE60-MIB::deviceSerialNo.0
        version: SAF-FREEMILE60-MIB::firmwareVersion.0
    sensors:
        voltage:
            data:
                -
                    oid: SAF-IPADDONS::iduInputVoltage
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.5.15.1.2.{{ $index }}'
                    descr: 'System Voltage'
        temperature:
            data:
                -
                    oid: SAF-IPRADIO::sysTemperature
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.5.1.1.1.5{{ $noindex }}'
                    descr: 'System Temperature'
                -
                    oid: SAF-FREEMILE60-MIB::cpuTemperature
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.3.3.{{ $index }}'
                    descr: 'CPU Temperature'
                    index: 'cpuTemperature.{{ $index }}'
                -
                    oid: SAF-FREEMILE60-MIB::wirelessRadioTable
                    value: SAF-FREEMILE60-MIB::wirelessRadioModemTemperature
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.2.2.1.10.{{ $index }}'
                    descr: '{{ SAF-FREEMILE60-MIB::wirelessRadioName }} Modem Temperature'
                    index: 'wirelessRadioModemTemperature.{{ $index }}'
                    group: 'Wireless Radio'
                -
                    oid: SAF-FREEMILE60-MIB::wirelessRadioTable
                    value: SAF-FREEMILE60-MIB::wirelessRadioTemperature
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.2.2.1.11.{{ $index }}'
                    descr: '{{ SAF-FREEMILE60-MIB::wirelessRadioName }} Temperature'
                    index: 'wirelessRadioTemperature.{{ $index }}'
                    group: 'Wireless Radio'
        count:
            data:
                -
                    oid: SAF-FREEMILE60-MIB::physicalPortCount
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.1.1.{{ $index }}'
                    descr: 'Physical Port Count'
                    index: 'physicalPortCount.{{ $index }}'
                -
                    oid: SAF-FREEMILE60-MIB::wirelessRadioCount
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.2.1.{{ $index }}'
                    descr: 'Wireless Radio Count'
                    index: 'wirelessRadioCount.{{ $index }}'
                -
                    oid: SAF-FREEMILE60-MIB::wirelessVapsCount
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.2.3.{{ $index }}'
                    descr: 'Wireless VAPs Count'
                    index: 'wirelessVapsCount.{{ $index }}'
                -
                    oid: SAF-FREEMILE60-MIB::wirelessPeersCount
                    num_oid: '.1.3.6.1.4.1.7571.100.1.1.12.2.5.{{ $index }}'
                    descr: 'Wireless Peers Count'
                    index: 'wirelessPeersCount.{{ $index }}'