modules:
    mempools:
        data:
            -
                used: RAPID-CITY::rcKhiSlotMemUsed
                free: RAPID-CITY::rcKhiSlotMemFree
#                percent_used: RAPID-CITY::rcKhiSlotMemUtil
                type: avaya-vsp
                descr: 'VOSS Memory'
                precision: 1024
                index: 0
    os:
        sysDescr_regex: '/(?<hardware>\S+) \((?<version>[^)]+)\)/'
        version: RAPID-CITY::rcSysVersion.0
        version_regex: '/(?<version>\d+\.\d+\S+)/'
        serial: RAPID-CITY::rcChasSerialNumber.0
    processors:
        data:
            -
                oid: RAPID-CITY::rcKhiSlotCpu5MinAve
                num_oid: '.1.3.6.1.4.1.2272.1.85.10.1.1.3.{{ $index }}'
                descr: VOSS Processor
    sensors:
        temperature:
            data:
                -
                    oid: RAPID-CITY::rcVossSystemTemperatureTable
                    value: RAPID-CITY::rcVossSystemTemperatureTemperature
                    num_oid: '.1.3.6.1.4.1.2272.1.101.1.1.2.1.3.{{ $index }}'
                    descr: RAPID-CITY::rcVossSystemTemperatureSensorDescription
                    index: 'rcVossSystemTemperatureTemperature.{{ $index }}'
                    high_limit: RAPID-CITY::rcVossSystemTemperatureCriticalThreshold
                    warn_limit: RAPID-CITY::rcVossSystemTemperatureWarningThreshold
        state:
            data:
                -
                    oid: RAPID-CITY::rcVossSystemTemperatureTable
                    value: RAPID-CITY::rcVossSystemTemperatureStatus
                    num_oid: '.1.3.6.1.4.1.2272.1.101.1.1.2.1.6.{{ $index }}'
                    descr: RAPID-CITY::rcVossSystemTemperatureSensorDescription
                    index: 'rcVossSystemTemperatureStatus.{{ $index }}'
                    state_name: rcVossSystemTemperatureStatus
                    states:
                        - { descr: normal, value: 1, generic: 0 }
                        - { descr: highWarning, value: 2, generic: 1 }
                        - { descr: highCritical, value: 3, generic: 2 }
                -
                    oid: RAPID-CITY::rcVossSystemFanInfoTable
                    value: RAPID-CITY::rcVossSystemFanInfoOperStatus
                    num_oid: '.1.3.6.1.4.1.2272.1.101.1.1.4.1.4.{{ $index }}'
                    descr: 'VOSS Tray {{ $subindex0 }} Fan {{ $subindex1 }}'
                    index: 'rcVossSystemFanInfoOperStatus.{{ $index }}'
                    warn_limit: 3
                    high_limit: 3
                    state_name: rcVossSystemFanInfoOperStatus
                    states:
                        - { descr: unknown, value: 1, generic: 3 }
                        - { descr: up, value: 2, generic: 0 }
                        - { descr: down, value: 3, generic: 1 }
                        - { descr: notPresent, value: 4, generic: 3 }
                -
                    oid: RAPID-CITY::rcChasPowerSupplyTable
                    value: RAPID-CITY::rcChasPowerSupplyOperStatus
                    num_oid: '.1.3.6.1.4.1.2272.1.4.8.1.1.2.{{ $index }}'
                    descr: 'VOSS Power Supply {{ $index }}'
                    index: 'rcChasPowerSupplyOperStatus.{{ $index }}'
                    warn_limit: 4
                    high_limit: 4
                    state_name: rcChasPowerSupplyOperStatus
                    states:
                        - { descr: unknown, value: 1, generic: 3 }
                        - { descr: empty, value: 2, generic: 0 }
                        - { descr: up, value: 3, generic: 0 }
                        - { descr: down, value: 4, generic: 1 }
