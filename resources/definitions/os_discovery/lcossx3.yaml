modules:
    os:
        hardware: '.1.3.6.1.2.1.47.1.1.1.1.13.1'
        version: '.1.3.6.1.2.1.47.1.1.1.1.9.1'
        serial: '.1.3.6.1.2.1.47.1.1.1.1.11.1'

    sensors:
        power:
            data:
                -
                    oid: POWER-ETHERNET-MIB::pethMainPseTable
                    value: POWER-ETHERNET-MIB::pethMainPsePower
                    num_oid: '.1.3.6.1.2.1.105.1.3.1.1.2.{{ $index }}'
                    index: 'pethMainPsePower.{{ $index }}'
                    group: 'PoE'
                    descr: 'PoE Budget Total - ID {{ $index }}'

                -
                    oid: POWER-ETHERNET-MIB::pethMainPseTable
                    value: POWER-ETHERNET-MIB::pethMainPseConsumptionPower
                    num_oid: '.1.3.6.1.2.1.105.1.3.1.1.4.{{ $index }}'
                    index: 'pethMainPseConsumptionPower.{{ $index }}'
                    high_limit: POWER-ETHERNET-MIB::pethMainPsePower
                    group: 'PoE'
                    descr: 'PoE Budget Consumed - ID {{ $index }}'

        state:
            data:
                -
                    oid: POWER-ETHERNET-MIB::pethPsePortTable
                    value: POWER-ETHERNET-MIB::pethPsePortDetectionStatus
                    num_oid: '.1.3.6.1.2.1.105.1.1.1.6.{{ $index }}'
                    index: 'pethPsePortDetectionStatus.{{ $subindex1 }}'
                    descr: 'PoE Port {{ $subindex1 }}'
                    group: 'PoE Port Status'
                    state_name: pethPsePortDetectionStatus
                    states:
                        - { value: 1, generic: 0, descr: disabled }
                        - { value: 2, generic: 0, descr: searching }
                        - { value: 3, generic: 0, descr: deliveringPower }
                        - { value: 4, generic: 2, descr: fault }
                        - { value: 5, generic: 1, descr: test }
                        - { value: 6, generic: 2, descr: otherFault }
