modules:
    mempools:
        additional_oids:
            oids:
                - ASAM-EQUIP-MIB::eqptBoardTable
        data:
            -
                total: ASAM-SYSTEM-MIB::totalMemSize
                used: ASAM-SYSTEM-MIB::memAbsoluteUsage
                precision: 1048576
                descr: '{{ ASAM-EQUIP-MIB::eqptBoardInventoryTypeName }}: {{ ASAM-EQUIP-MIB::eqptBoardIfSlotId }} Memory ({{ $index }})'
                warn_percent: 98
    os:
        hardware: ASAM-EQUIP-MIB::eqptHolderActualType.17
        serial: ASAM-EQUIP-MIB::eqptHolderSerialNumber.17
        version: ASAM-SYSTEM-MIB::swEtsiVersion.0
    processors:
        data:
            -
                oid: ASAM-SYSTEM-MIB::cpuLoadTable
                value: ASAM-SYSTEM-MIB::cpuLoadAverage
                num_oid: '.1.3.6.1.4.1.637.61.1.9.29.1.1.4.{{ $index }}'
                descr: CPU {{ $index }}

    sensors:
        count:
            data:
                -
                    oid: ASAM-ALARM-MIB::asamNumberofAlarmEntries
                    num_oid: '.1.3.6.1.4.1.637.61.1.3.4.{{ $index }}'
                    index: 'asamNumberofAlarmEntries.{{ $index }}'
                    descr: 'Alarm: Current Count'
                    group: 'Alarms'
        temperature:
            data:
                -
                    oid: ASAM-EQUIP-MIB::eqptBoardThermalSensorTable
                    value: ASAM-EQUIP-MIB::eqptBoardThermalSensorActualTemperature
                    num_oid: '.1.3.6.1.4.1.637.61.1.23.10.1.2.{{ $index }}'
                    index: '{{ nokiaIsamSlot:0 }}.{{ $subindex1 }}-temp'
                    descr: '{{ nokiaIsamSlot:0 }} Sensor {{ $subindex1 }}'
                    high_limit: ASAM-EQUIP-MIB::eqptBoardThermalSensorShutdownThresholdHigh
                    warn_limit: ASAM-EQUIP-MIB::eqptBoardThermalSensorTcaThresholdHigh
        state:
            data:
                -
                    oid: ASAM-EQUIP-MIB::eqptFanMode
                    num_oid: '.1.3.6.1.4.1.637.61.1.23.1.9.{{ $index }}'
                    descr: Fan Mode
                    group: 'Hardware'
                    state_name: fanMode
                    states:
                        - { value: 0, generic: 0, descr: 'default' }
                        - { value: 1, generic: 1, descr: 'eco' }
                        - { value: 2, generic: 0, descr: 'protect' }
                        - { value: 3, generic: 0, descr: 'classic' }
                -
                    oid: ASAM-ALARM-MIB::asamCurrentAlarmSeverityStatus
                    num_oid: '.1.3.6.1.4.1.637.61.1.3.5.{{ $index }}'
                    descr: 'Alarm: Current Status'
                    group: 'Alarms'
                    state_name: alarmCurrentSeverityStatus
                    user_func: highestBit
                    states:
                        - { value: 1, generic: 0, descr: 'NoDefect' }
                        - { value: 2, generic: 3, descr: 'Indeterminate' }
                        - { value: 4, generic: 1, descr: 'Warning' }
                        - { value: 8, generic: 1, descr: 'Minor' }
                        - { value: 16, generic: 2, descr: 'Major' }
                        - { value: 32, generic: 2, descr: 'Critical' }
                -
                    # planned slots
                    oid: ASAM-EQUIP-MIB::eqptBoardTable
                    value: ASAM-EQUIP-MIB::eqptBoardOperError
                    num_oid: '.1.3.6.1.4.1.637.61.1.23.3.1.7.{{ $index }}'
                    descr: '{{ nokiaIsamSlot }} {{ ASAM-EQUIP-MIB::eqptSlotActualType }} ({{ ASAM-EQUIP-MIB::eqptSlotPlannedType }})'
                    group: '{{ nokiaIsamBoardGroup }}'
                    state_name: eqptBoardOperError
                    skip_values:
                        - 0
                        - { oid: ASAM-EQUIP-MIB::eqptSlotPlannedType, op: '=', value: 'NOT_PLANNED' }
                    states: &eqptBoardOperError
                        - { value: 1, generic: 0, descr: 'no-error' }
                        - { value: 2, generic: 1, descr: 'type-mismatch' }
                        - { value: 3, generic: 2, descr: 'board-missing' }
                        - { value: 4, generic: 2, descr: 'board-installation-missing' }
                        - { value: 5, generic: 1, descr: 'no-planned-board' }
                        - { value: 6, generic: 1, descr: 'waiting-for-sw' }
                        - { value: 7, generic: 2, descr: 'init-boot-failed' }
                        - { value: 8, generic: 2, descr: 'init-download-failed' }
                        - { value: 9, generic: 2, descr: 'init-connection-failed' }
                        - { value: 10, generic: 2, descr: 'init-configuration-failed' }
                        - { value: 11, generic: 1, descr: 'board-reset-protection' }
                        - { value: 12, generic: 2, descr: 'invalid-parameter' }
                        - { value: 13, generic: 1, descr: 'temperature-alarm' }
                        - { value: 14, generic: 2, descr: 'tempshutdown' }
                        - { value: 15, generic: 1, descr: 'defense' }
                        - { value: 16, generic: 1, descr: 'board-not-licensed' }
                        - { value: 17, generic: 2, descr: 'sem-power-fail' }
                        - { value: 18, generic: 2, descr: 'sem-ups-fail' }
                        - { value: 19, generic: 2, descr: 'board-in-incompatible-slot' }
                        - { value: 21, generic: 1, descr: 'download-ongoing' }
                        - { value: 255, generic: 2, descr: 'unknown-error' }
                -
                    # unplanned slots holding a board
                    oid: ASAM-EQUIP-MIB::eqptBoardTable
                    value: ASAM-EQUIP-MIB::eqptBoardOperError
                    num_oid: '.1.3.6.1.4.1.637.61.1.23.3.1.7.{{ $index }}'
                    descr: '{{ nokiaIsamSlot }} {{ ASAM-EQUIP-MIB::eqptSlotActualType }} ({{ ASAM-EQUIP-MIB::eqptSlotPlannedType }})'
                    group: '{{ nokiaIsamBoardGroup }}'
                    state_name: eqptBoardOperError
                    skip_values:
                        - 0
                        - { oid: ASAM-EQUIP-MIB::eqptSlotPlannedType, op: '!=', value: 'NOT_PLANNED' }
                        - { oid: ASAM-EQUIP-MIB::eqptSlotActualType, op: '=', value: 'EMPTY' }
                    states: *eqptBoardOperError
