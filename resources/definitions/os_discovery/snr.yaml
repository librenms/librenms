modules:
    os:
        # Model, firmware and serial come from sysDescr on every SNR family.
        # S5210X/S5110G (57206 tree) do not expose sysHardwareVersion or
        # sysSoftwareVersion; the version OIDs below override where present.
        sysDescr_regex:
            - '/^SNR-(?<hardware>\S+) Device/'
            - '/SoftWare Version (?<version>\S+)/'
            - '/Serial No\.:\s*(?<serial>\S+)/'
        version:
            - NAG-MIB::sysSoftwareVersion.0
            - NAG-MIB::sysSoftwareVersion.1
    mempools:
        data:
            # Legacy per-slot table, values in bytes. Slot 1 keeps index 0
            # so already monitored devices keep their mempool RRD.
            -
                total: NAG-MIB::sysMemorySize
                used: NAG-MIB::sysMemoryBusy
                descr: 'Memory {{ $index }}'
                index: 0
                skip_values:
                    -
                        oid: index
                        op: '!='
                        value: 1
            -
                total: NAG-MIB::sysMemorySize
                used: NAG-MIB::sysMemoryBusy
                descr: 'Memory {{ $index }}'
                skip_values:
                    -
                        oid: index
                        op: '='
                        value: 1
            # Scalar branch for models without the legacy table. It repeats
            # slot 1 where the legacy table exists and is reported in
            # megabytes on some models (snr_s2990x), skip it in both cases.
            -
                total: NAG-MIB::switchMemorySize
                used: NAG-MIB::switchMemoryBusy
                descr: 'Memory'
                index: 0
                skip_values:
                    -
                        oid: NAG-MIB::sysMemorySize.1
                        op: exists
                        value: true
                    -
                        oid: NAG-MIB::switchMemorySize
                        op: '<'
                        value: 1048576
    processors:
        data:
            # Legacy per-slot table.
            -
                oid: 'NAG-MIB::sysCpuUsage'
                num_oid: '.1.3.6.1.4.1.40418.7.100.1.8.1.11.{{ $index }}'
                descr: 'CPU {{ $index }}'
            # Scalar branch for models without the legacy table. Models with
            # the legacy table repeat slot 1 here, they are skipped.
            -
                oid: 'NAG-MIB::switchCpuUsage'
                num_oid: '.1.3.6.1.4.1.40418.7.100.1.11.10.{{ $index }}'
                descr: 'CPU'
                skip_values:
                    -
                        device: sysObjectID
                        op: in_array
                        value: ['.1.3.6.1.4.1.40418.7.44', '.1.3.6.1.4.1.40418.7.441', '.1.3.6.1.4.1.40418.7.444', '.1.3.6.1.4.1.40418.7.45', '.1.3.6.1.4.1.40418.7.53', '.1.3.6.1.4.1.40418.7.54', '.1.3.6.1.4.1.40418.7.61', '.1.3.6.1.4.1.40418.8.67']
    additional_oids:
        data:
            -
                oid:
                    - NAG-MIB::portName
    sensors:
        temperature:
            data:
                -
                    oid: NAG-MIB::sysTemperature
                    num_oid: '.1.3.6.1.4.1.40418.7.100.1.8.1.10.{{ $index }}'
                    descr: 'Temperature {{ $index }}'
                -
                    oid: NAG-MIB::switchTemperature
                    num_oid: '.1.3.6.1.4.1.40418.7.100.1.11.9.{{ $index }}'
                    index: 'switchTemperature.{{ $index }}'
                    descr: 'Temperature'
                    # 268435356 means no sensor (S2985G). Models with the legacy
                    # table repeat slot 1 here, they are skipped.
                    skip_values:
                        - 268435356
                        -
                            device: sysObjectID
                            op: in_array
                            value: ['.1.3.6.1.4.1.40418.7.44', '.1.3.6.1.4.1.40418.7.441', '.1.3.6.1.4.1.40418.7.444', '.1.3.6.1.4.1.40418.7.45', '.1.3.6.1.4.1.40418.7.53', '.1.3.6.1.4.1.40418.7.54', '.1.3.6.1.4.1.40418.7.61', '.1.3.6.1.4.1.40418.8.67']
        state:
            data:
                -
                    oid: NAG-MIB::sysFanStatus
                    num_oid: '.1.3.6.1.4.1.40418.7.100.1.12.1.1.3.{{ $index }}'
                    descr: 'Fan {{ $index }} status'
                    state_name: sysFanStatus
                    states:
                        - { descr: Normal, value: 0, generic: 0 }
                        - { descr: Abnormal, value: 1, generic: 2 }
                -
                    oid: NAG-MIB::sysFanSpeed
                    num_oid: '.1.3.6.1.4.1.40418.7.100.1.12.1.4.{{ $index }}'
                    descr: 'Fan {{ $index }} speed'
                    state_name: sysFanSpeed
                    states:
                        - { value: 0, generic: 3, descr: none }
                        - { value: 1, generic: 0, descr: low }
                        - { value: 2, generic: 0, descr: medium-low }
                        - { value: 3, generic: 1, descr: medium }
                        - { value: 4, generic: 2, descr: medium-high }
                        - { value: 5, generic: 2, descr: high }
                -
                    oid: NAG-MIB::showSwitchStartUpStatus
                    num_oid: '.1.3.6.1.4.1.40418.7.100.1.16.{{ $index }}'
                    descr: 'Switch {{ $index }} Startup status'
                    state_name: showSwitchStartUpStatus
                    states:
                        - { descr: idle, value: 1, generic: 3 }
                        - { descr: success, value: 2, generic: 0 }
                        - { descr: fail, value: 3, generic: 2 }
                        - { descr: inProgress, value: 4, generic: 3 }
        voltage:
            data:
                -
                    oid: NAG-MIB::ddmTranscDiagnosisTable
                    value: NAG-MIB::ddmDiagnosisVoltage
                    num_oid: '.1.3.6.1.4.1.40418.7.100.30.1.1.7.{{ $index }}'
                    descr: "{{ NAG-MIB::portName }}"
                    index: "ddmDiagnosisVoltage.{{ $index }}"
        current:
            data:
                -
                    oid: NAG-MIB::ddmTranscDiagnosisTable
                    value: NAG-MIB::ddmDiagnosisBias
                    num_oid: '.1.3.6.1.4.1.40418.7.100.30.1.1.12.{{ $index }}'
                    descr: "{{ NAG-MIB::portName }}"
                    index: "ddmDiagnosisBias.{{ $index }}"
        dbm:
            data:
                -
                    oid: NAG-MIB::ddmTranscDiagnosisTable
                    value: NAG-MIB::ddmDiagnosisRXPower
                    num_oid: '.1.3.6.1.4.1.40418.7.100.30.1.1.17.{{ $index }}'
                    descr: "{{ NAG-MIB::portName }}"
                    index: "ddmDiagnosisRXPower.{{ $index }}"
                    group: "Optical RX"
                -
                    oid: NAG-MIB::ddmTranscDiagnosisTable
                    value: NAG-MIB::ddmDiagnosisTXPower
                    num_oid: '.1.3.6.1.4.1.40418.7.100.30.1.1.22.{{ $index }}'
                    descr: "{{ NAG-MIB::portName }}"
                    index: "ddmDiagnosisTXPower.{{ $index }}"
                    group: "Optical TX"
