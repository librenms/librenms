modules:
    os:
        version: ORION-BASE-MIB::dcSoftwareVersion.0
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - ORION-BASE-MIB::dcMeasurementTable
                        - ORION-BASE-MIB::dcMeterPanelEventTable
        state:
            data:
                -
                    oid: ORION-BASE-MIB::dcMeterPanelEventTable
                    value: ORION-BASE-MIB::dcMeterPanelEventValue
                    num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.10.1.1.3.{{ $index }}'
                    state_name: dcMeterPanelEventTable
                    descr: '{{ ORION-BASE-MIB::dcMeterPanelEventName }}'
                    states:
                        - { value: 1, descr: off, generic: 0 }
                        - { value: 2, descr: indeterminate, generic: 3 }
                        - { value: 3, descr: on, generic: 2 }
        temperature:
            options:
                skip_values:
                -
                  oid: ORION-BASE-MIB::dcMeasurementUnit
                  op: '!='
                  value: 7
                -
                  oid: ORION-BASE-MIB::dcMeasurementValue
                  op: 'in_array'
                  value: [0, 2147483647]
            data:
                -
                  oid: ORION-BASE-MIB::dcMeasurementTable
                  value: ORION-BASE-MIB::dcMeasurementValue
                  num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.9.1.1.3.{{ $index }}'
                  descr: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  divisor: 10
                  low_limit: 10
                  high_limit: 50
        voltage:
            options:
                skip_values:
                -
                  oid: ORION-BASE-MIB::dcMeasurementUnit
                  op: '!='
                  value: 3
                -
                  oid: ORION-BASE-MIB::dcMeasurementValue
                  op: 'in_array'
                  value: [0, 2147483647]
            data:
                -
                  oid: ORION-BASE-MIB::dcMeasurementTable
                  value: ORION-BASE-MIB::dcMeasurementValue
                  num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.9.1.1.3.{{ $index }}'
                  descr: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  divisor: 100
                  low_limit: 46
                  high_limit: 56
        current:
            options:
                skip_values:
                -
                  oid: ORION-BASE-MIB::dcMeasurementUnit
                  op: '!='
                  value: 5
                -
                  oid: ORION-BASE-MIB::dcMeasurementValue
                  op: 'in_array'
                  value: [0, 2147483647]
            data:
                -
                  oid: ORION-BASE-MIB::dcMeasurementTable
                  value: ORION-BASE-MIB::dcMeasurementValue
                  num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.9.1.1.3.{{ $index }}'
                  descr: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  divisor: 10
        # dcMeasurementUnit 12 = percent. Rows are matched by name because the
        # table also has other percent rows, e.g. "Ibatt relative".
        # Without BMS data (e.g. BMS shut down after a deep discharge) the
        # per-battery SoC/SoH rows report 0 and State of Charge 2147483647.
        # Rows are indexed by sorted name position, so use the name as index.
        # high_limit 101: a full battery stays OK, the no-data value does not.
        charge:
            data:
                -
                  oid: ORION-BASE-MIB::dcMeasurementTable
                  value: ORION-BASE-MIB::dcMeasurementValue
                  num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.9.1.1.3.{{ $index }}'
                  descr: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  index: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  low_limit: 30
                  low_warn_limit: 50
                  high_limit: 101
                  skip_values:
                    -
                      oid: ORION-BASE-MIB::dcMeasurementUnit
                      op: '!='
                      value: 12
                    -
                      oid: ORION-BASE-MIB::dcMeasurementName
                      op: 'not_regex'
                      value: '/\b(SoC|State of Charge)/i'
                    -
                      oid: ORION-BASE-MIB::dcMeasurementValue
                      op: 'in_array'
                      value: [0, 2147483647]
        percent:
            data:
                -
                  oid: ORION-BASE-MIB::dcMeasurementTable
                  value: ORION-BASE-MIB::dcMeasurementValue
                  num_oid: '.1.3.6.1.4.1.20246.2.3.1.1.1.2.9.1.1.3.{{ $index }}'
                  descr: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  index: '{{ ORION-BASE-MIB::dcMeasurementName }}'
                  low_limit: 70
                  low_warn_limit: 80
                  high_limit: 101
                  skip_values:
                    -
                      oid: ORION-BASE-MIB::dcMeasurementUnit
                      op: '!='
                      value: 12
                    -
                      oid: ORION-BASE-MIB::dcMeasurementName
                      op: 'not_regex'
                      value: '/\b(SoH|State of Health)/i'
                    -
                      oid: ORION-BASE-MIB::dcMeasurementValue
                      op: 'in_array'
                      value: [0, 2147483647]
