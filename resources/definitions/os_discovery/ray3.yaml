modules:
    os:
        features: RAY3-MIB::unitType.0
        hardware: RAY3-MIB::productName.0
        serial: RAY3-MIB::serialNumber.0
        version: RAY3-MIB::swVer.0

    mempools:
        data:
            -
                percent_used: RAY3-MIB::useMemory

    processors:
        data:
            -
                oid: RAY3-MIB::useCpu
                num_oid: '.1.3.6.1.4.1.33555.4.1.5.1.{{ $index }}'

    sensors:
        voltage:
            data:
                -
                    oid: RAY3-MIB::voltageUnit
                    num_oid: '.1.3.6.1.4.1.33555.4.1.4.3.{{ $index }}'
                    descr: Voltage
                    divisor: 10

        temperature:
            data:
                -
                    oid: RAY3-MIB::temperatureRadio
                    num_oid: '.1.3.6.1.4.1.33555.4.1.4.2.{{ $index }}'
                    descr: Temperature
                    divisor: 100

        ber:
            data:
                -
                    oid: RAY3-MIB::ber
                    num_oid: '.1.3.6.1.4.1.33555.4.3.2.11.{{ $index }}'
                    descr: BER
                    low_warn_limit: 0
                    warn_limit: 0

        state:
            data:
                -
                    oid: RAY3-MIB::systemStatus
                    value: RAY3-MIB::systemStatus
                    num_oid: '.1.3.6.1.4.1.33555.4.1.3.1.{{ $index }}'
                    descr: System Status
                    state_name: systemStatus
                    states:
                        - { value: 0, descr: Unknown, generic: 3 }
                        - { value: 1, descr: Ok, generic: 0 }
                        - { value: 2, descr: Warning, generic: 2 }
                        - { value: 3, descr: Alarm, generic: 3 }

                -
                    oid: RAY3-MIB::lineStatusII
                    value: RAY3-MIB::lineStatusII
                    num_oid: '.1.3.6.1.4.1.33555.4.1.3.8.{{ $index }}'
                    descr: Radio Link Status
                    state_name: lineStatusII
                    states:
                        - { value: 0, descr: Unknown, generic: 3 }
                        - { value: 1, descr: Setup, generic: 1 }
                        - { value: 2, descr: Single, generic: 1 }
                        - { value: 3, descr: Connecting, generic: 2 }
                        - { value: 4, descr: Authorizing, generic: 2 }
                        - { value: 5, descr: Ok, generic: 0 }
                        - { value: 6, descr: Analyzer, generic: 2 }

                -
                    oid: RAY3-MIB::eth1Link
                    value: RAY3-MIB::eth1Link
                    num_oid: '.1.3.6.1.4.1.33555.4.1.3.9.{{ $index }}'
                    descr: Ethernet 1 Link
                    state_name: eth1Link
                    states:
                        - { value: 0, descr: Unknown, generic: 3 }
                        - { value: 1, descr: Up, generic: 0 }
                        - { value: 2, descr: Down, generic: 3 }

                -
                    oid: RAY3-MIB::eth2Link
                    value: RAY3-MIB::eth2Link
                    num_oid: '.1.3.6.1.4.1.33555.4.1.3.10.{{ $index }}'
                    descr: Ethernet 2 Link
                    state_name: eth2Link
                    states:
                        - { value: 0, descr: Unknown, generic: 3 }
                        - { value: 1, descr: Up, generic: 0 }
                        - { value: 2, descr: Down, generic: 3 }

                -
                    # RAY3-MIB::txModulationIndex is ifRadio.8 (not .7).
                    # Labels follow live DisplayStrings (txModulation/rxModulation),
                    # not the qpskS-shifted ModulationList enum in the shipped MIB
                    # (verified: index 7 => "512QAM", index 9 => "2048QAM").
                    oid: RAY3-MIB::txModulationIndex
                    num_oid: '.1.3.6.1.4.1.33555.4.2.1.8.{{ $index }}'
                    descr: Tx Modulation Rate
                    state_name: txModulationIndex-ray3
                    states:
                        - { value: 0, generic: 3, descr: 'n/a' }
                        - { value: 1, generic: 0, descr: 'QPSK' }
                        - { value: 2, generic: 0, descr: 'QAM16' }
                        - { value: 3, generic: 0, descr: 'QAM32' }
                        - { value: 4, generic: 0, descr: 'QAM64' }
                        - { value: 5, generic: 0, descr: 'QAM128' }
                        - { value: 6, generic: 0, descr: 'QAM256' }
                        - { value: 7, generic: 0, descr: 'QAM512' }
                        - { value: 8, generic: 0, descr: 'QAM1024' }
                        - { value: 9, generic: 0, descr: 'QAM2048' }
                        - { value: 10, generic: 0, descr: 'QAM4096' }
                        - { value: 11, generic: 0, descr: 'QAM4096' }

                -
                    # RAY3-MIB::rxModulationIndex is ifRadio.7 (not .8)
                    oid: RAY3-MIB::rxModulationIndex
                    num_oid: '.1.3.6.1.4.1.33555.4.2.1.7.{{ $index }}'
                    descr: Rx Modulation Rate
                    state_name: rxModulationIndex-ray3
                    states:
                        - { value: 0, generic: 3, descr: 'n/a' }
                        - { value: 1, generic: 0, descr: 'QPSK' }
                        - { value: 2, generic: 0, descr: 'QAM16' }
                        - { value: 3, generic: 0, descr: 'QAM32' }
                        - { value: 4, generic: 0, descr: 'QAM64' }
                        - { value: 5, generic: 0, descr: 'QAM128' }
                        - { value: 6, generic: 0, descr: 'QAM256' }
                        - { value: 7, generic: 0, descr: 'QAM512' }
                        - { value: 8, generic: 0, descr: 'QAM1024' }
                        - { value: 9, generic: 0, descr: 'QAM2048' }
                        - { value: 10, generic: 0, descr: 'QAM4096' }
                        - { value: 11, generic: 0, descr: 'QAM4096' }
