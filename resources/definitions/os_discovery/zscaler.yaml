modules:
    os:
        sysDescr_regex:
            - '/ZscalerOS (?<version>\S+) FreeBSD/'
            - '/^Linux zpa-service-edge (?<version>\S+) /'
            - '/(?<hardware>aarch64|amd64|arm\w*|i386|x86_64)\s*$/i'
    sensors:
        percent:
            data:
                -
                    oid: ZSCALER-SWAPINFO-MIB::swapinfoTable
                    value: ZSCALER-SWAPINFO-MIB::osswap_cur_used_inpercentage
                    num_oid: '.1.3.6.1.4.1.46262.6.2.1.11.{{ $index }}'
                    descr: 'Swap used {{ ZSCALER-SWAPINFO-MIB::swapinfoName }}'
                    index: 'swapused.{{ $index }}'
                    divisor: 100
                    group: Swap
                -
                    oid: ZSCALER-PROCESSHEALTH-MIB::processhealthTable
                    value: ZSCALER-PROCESSHEALTH-MIB::module_cpu_use
                    num_oid: '.1.3.6.1.4.1.46262.5.2.1.10.{{ $index }}'
                    descr: 'CPU {{ ZSCALER-PROCESSHEALTH-MIB::processhealthName }} ({{ ZSCALER-PROCESSHEALTH-MIB::processhealthInstance }})'
                    index: 'processcpu.{{ $index }}'
                    divisor: 100
                    group: Processes
