modules:
    bgp-peers:
        peers:
            -
                index_layout: [address]
                remote_as: CISCO-BGP4-MIB::cbgpPeer2RemoteAs
                local_as: CISCO-BGP4-MIB::cbgpPeer2LocalAs
                state: CISCO-BGP4-MIB::cbgpPeer2State
                admin_status: CISCO-BGP4-MIB::cbgpPeer2AdminStatus
                local_address: CISCO-BGP4-MIB::cbgpPeer2LocalAddr
                last_error: CISCO-BGP4-MIB::cbgpPeer2LastError
                last_error_text: CISCO-BGP4-MIB::cbgpPeer2LastErrorTxt
                established_time: CISCO-BGP4-MIB::cbgpPeer2FsmEstablishedTime
                update_elapsed_time: CISCO-BGP4-MIB::cbgpPeer2InUpdateElapsedTime
                in_updates: CISCO-BGP4-MIB::cbgpPeer2InUpdates
                out_updates: CISCO-BGP4-MIB::cbgpPeer2OutUpdates
                in_messages: CISCO-BGP4-MIB::cbgpPeer2InTotalMessages
                out_messages: CISCO-BGP4-MIB::cbgpPeer2OutTotalMessages
        address_families:
            -
                index_layout: [address, afi, safi]
                accepted: CISCO-BGP4-MIB::cbgpPeer2AcceptedPrefixes
                denied: CISCO-BGP4-MIB::cbgpPeer2DeniedPrefixes
                admin_limit: CISCO-BGP4-MIB::cbgpPeer2PrefixAdminLimit
                threshold: CISCO-BGP4-MIB::cbgpPeer2PrefixThreshold
                clear_threshold: CISCO-BGP4-MIB::cbgpPeer2PrefixClearThreshold
                advertised: CISCO-BGP4-MIB::cbgpPeer2AdvertisedPrefixes
                suppressed: CISCO-BGP4-MIB::cbgpPeer2SuppressedPrefixes
                withdrawn: CISCO-BGP4-MIB::cbgpPeer2WithdrawnPrefixes
            -
                index_layout: [ip, afi, safi]
                fallback: true
                accepted: CISCO-BGP4-MIB::cbgpPeerAcceptedPrefixes
                denied: CISCO-BGP4-MIB::cbgpPeerDeniedPrefixes
                admin_limit: CISCO-BGP4-MIB::cbgpPeerPrefixAdminLimit
                threshold: CISCO-BGP4-MIB::cbgpPeerPrefixThreshold
                clear_threshold: CISCO-BGP4-MIB::cbgpPeerPrefixClearThreshold
                advertised: CISCO-BGP4-MIB::cbgpPeerAdvertisedPrefixes
                suppressed: CISCO-BGP4-MIB::cbgpPeerSuppressedPrefixes
                withdrawn: CISCO-BGP4-MIB::cbgpPeerWithdrawnPrefixes
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - CISCO-VOICE-DIAL-CONTROL-MIB::cvSipMsgRateWMValue
        power:
            data:
                -
                    oid: POWER-ETHERNET-MIB::pethMainPseTable
                    value: POWER-ETHERNET-MIB::pethMainPsePower
                    num_oid: '.1.3.6.1.2.1.105.1.3.1.1.2.{{ $index }}'
                    index: 'pethMainPsePower.{{ $index }}'
                    group: "PoE"
                    descr: "PoE Budget Total - ID {{ $index }}"
                -
                    oid: CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseTable
                    value: CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseUsedPower
                    divisor: 1000
                    num_oid: '.1.3.6.1.4.1.9.9.402.1.3.1.4.{{ $index }}'
                    index: 'cpeExtMainPseUsedPower.{{ $index }}'
                    group: "PoE"
                    descr: "PoE Budget Consumed - {{ CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseDescr }}"
                -
                    oid: CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseTable
                    value: CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseRemainingPower
                    divisor: 1000
                    num_oid: '.1.3.6.1.4.1.9.9.402.1.3.1.5.{{ $index }}'
                    index: 'cpeExtMainPseRemainingPower.{{ $index }}'
                    low_limit: 0
                    group: "PoE"
                    descr: "PoE Budget Remaining - {{ CISCO-POWER-ETHERNET-EXT-MIB::cpeExtMainPseDescr }}"
        count:
            data:
                -
                    oid: CISCO-POWER-ETHERNET-EXT-MIB::cpeExtPdStatistics
                    value:  CISCO-POWER-ETHERNET-EXT-MIB::cpeExtPdStatsTotalDevices
                    num_oid: '.1.3.6.1.4.1.9.9.402.1.4.1.{{ $index }}'
                    group: "PoE"
                    descr: "PoE Devices Connected"
                -
                    oid: CISCO-VOICE-DIAL-CONTROL-MIB::cvCallVolConnActiveConnection
                    num_oid: '.1.3.6.1.4.1.9.9.63.1.3.8.1.1.2.{{ $index }}'
                    group: "Voice"
                    descr: "SIP Active Connections"
                    skip_values:
                        -
                            oid: index
                            op: '!='
                            value: 2
                        -
                            oid: 'CISCO-VOICE-DIAL-CONTROL-MIB::cvSipMsgRateWMValue.3.1'
                            op: '='
                            value: 0
                -
                    oid: CISCO-SYSLOG-MIB::clogMsgIgnores
                    value: CISCO-SYSLOG-MIB::clogMsgIgnores
                    num_oid: '.1.3.6.1.4.1.9.9.41.1.1.4.{{ $index }}'
                    descr: 'Syslog Messages Ignored'
                    group: 'Syslog'
                    index: 'clogMsgIgnores.{{ $index }}'
                    rrd_type: COUNTER
                -
                    oid: CISCO-SYSLOG-MIB::clogMsgDrops
                    value: CISCO-SYSLOG-MIB::clogMsgDrops
                    num_oid: '.1.3.6.1.4.1.9.9.41.1.1.5.{{ $index }}'
                    descr: 'Syslog Messages Dropped'
                    group: 'Syslog'
                    index: 'clogMsgDrops.{{ $index }}'
                    rrd_type: COUNTER
        state:
            data:
                -
                    oid: CISCO-HSRP-MIB::cHsrpGrpTable
                    value: CISCO-HSRP-MIB::cHsrpGrpStandbyState
                    num_oid: '.1.3.6.1.4.1.9.9.106.1.2.1.1.15.{{ $index }}'
                    state_name: cHsrpGrpTable
                    descr: 'HSRP Status {{ CISCO-HSRP-MIB::cHsrpGrpVirtualIpAddr }}'
                    index: 'cHsrpGrpStandbyState.{{ $index }}'
                    group: 'HSRP'
                    states:
                        - { value:  1, generic: 2, descr: 'initial' }
                        - { value:  2, generic: 2, descr: 'learn' }
                        - { value:  3, generic: 1, descr: 'listen' }
                        - { value:  4, generic: 1, descr: 'speak' }
                        - { value:  5, generic: 0, descr: 'standby' }
                        - { value:  6, generic: 0, descr: 'active' }
                -
                    oid: OLD-CISCO-TS-MIB::ltsLineTable
                    value: OLD-CISCO-TS-MIB::tsLineActive
                    num_oid: '.1.3.6.1.4.1.9.2.9.2.1.1.{{ $index }}'
                    descr: '{{ OLD-CISCO-TS-MIB::tsLineLoc }} Status'
                    index: 'tsLineActive.{{ $index }}'
                    group: 'Serial Ports'
                    skip_values:
                        -
                            oid: OLD-CISCO-TS-MIB::tsLineType
                            op: '!='
                            value: 3
                    states:
                        - { value:  0, generic: 0, descr: 'Idle' }
                        - { value:  1, generic: 0, descr: 'In Use' }

