modules:
    os:
        hardware: ALGPWR-PDU-MIB::pduDataModel.0
    sensors:
        additional_oids:
            data:
                -
                    oid:
                        - ALGPWR-PDU-MIB::portNameP1
                        - ALGPWR-PDU-MIB::portDescP1
                        - ALGPWR-PDU-MIB::portNameP2
                        - ALGPWR-PDU-MIB::portDescP2
                        - ALGPWR-PDU-MIB::portNameP3
                        - ALGPWR-PDU-MIB::portDescP3
                        - ALGPWR-PDU-MIB::portNameP4
                        - ALGPWR-PDU-MIB::portDescP4
