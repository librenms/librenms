                        - ALGPWR-PDU-MIB::portDescP7
                        - ALGPWR-PDU-MIB::portNameP8
                        - ALGPWR-PDU-MIB::portDescP8
        voltage:
            data:
                -
                    oid: ALGPWR-PDU-MIB::pduDataBusVoltage
                    num_oid: '.1.3.6.1.4.1.49136.200.1.2.{{ $index }}'
                    index: bus
                    descr: 'Bus'
                    divisor: 1000
                -
                    oid: ALGPWR-PDU-MIB::portVoltP1
                    num_oid: '.1.3.6.1.4.1.49136.200.6.1.{{ $index }}'
                    index: port1
                    descr: '{{ ALGPWR-PDU-MIB::portNameP1 }}: {{ ALGPWR-PDU-MIB::portDescP1 }}'
                    divisor: 1000
