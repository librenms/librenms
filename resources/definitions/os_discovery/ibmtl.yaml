modules:
    os:
        hardware:
            - .1.3.6.1.4.1.14851.3.1.4.2.0
            - .1.3.6.1.4.1.2.6.210.3.1.1.8.1
            - .1.3.6.1.4.1.2.6.210.1.1.0
        serial:
            - .1.3.6.1.4.1.14851.3.1.3.2.0
            - .1.3.6.1.4.1.2.6.210.3.1.1.10.1
        version:
            - .1.3.6.1.4.1.14851.3.1.3.4.0
            - .1.3.6.1.4.1.2.6.210.1.4.0
    sensors:
        state:
            data:
                -
                    oid: SNIA-SML-MIB::scsiProtocolControllerTable
                    value: SNIA-SML-MIB::scsiProtocolController-OperationalStatus
                    num_oid: '.1.3.6.1.4.1.14851.3.1.12.2.1.4.{{ $index }}'
                    descr: SNIA-SML-MIB::scsiProtocolController-Description
                    states:
                        - { value: 0, generic: 3, descr: unknown,  }
                        - { value: 1, generic: 3, descr: other,  }
                        - { value: 2, generic: 0, descr: ok,  }
                        - { value: 3, generic: 1, descr: degraded,  }
                        - { value: 4, generic: 1, descr: stressed,  }
                        - { value: 5, generic: 1, descr: predictiveFailure,  }
                        - { value: 6, generic: 2, descr: error,  }
                        - { value: 7, generic: 2, descr: non-RecoverableError,  }
                        - { value: 8, generic: 1, descr: starting,  }
                        - { value: 9, generic: 1, descr: stopping,  }
                        - { value: 10, generic: 1, descr: stopped,  }
                        - { value: 11, generic: 1, descr: inService,  }
                        - { value: 12, generic: 1, descr: noContact,  }
                        - { value: 13, generic: 1, descr: lostCommunication,  }
                        - { value: 14, generic: 1, descr: aborted,  }
                        - { value: 15, generic: 1, descr: dormant,  }
                        - { value: 16, generic: 1, descr: supportingEntityInError,  }
                        - { value: 17, generic: 0, descr: completed,  }
                        - { value: 18, generic: 1, descr: powerMode,  }
                        - { value: 19, generic: 1, descr: dMTFReserved,  }
                -
                    oid: IBM-AUTOMATION-QUERY-MIB::frameconfigTable
                    value: IBM-AUTOMATION-QUERY-MIB::chassis-PS1Status
                    num_oid: '.1.3.6.1.4.1.2.6.257.1.3.2.1.3.{{ $index }}'
                    index: 'ps1.{{ $index }}'
                    descr: 'Frame {{ $index }} PSU 1'
                    state_name: chassis-PS1Status
                    states:
                        - { value: 0, generic: 3, descr: unknown }
                        - { value: 1, generic: 1, descr: notinstalled }
                        - { value: 2, generic: 0, descr: installed }
                -
                    oid: IBM-AUTOMATION-QUERY-MIB::frameconfigTable
                    value: IBM-AUTOMATION-QUERY-MIB::chassis-PS2Status
                    num_oid: '.1.3.6.1.4.1.2.6.257.1.3.2.1.4.{{ $index }}'
                    index: 'ps2.{{ $index }}'
                    descr: 'Frame {{ $index }} PSU 2'
                    state_name: chassis-PS2Status
                    states:
                        - { value: 0, generic: 3, descr: unknown }
                        - { value: 1, generic: 1, descr: notinstalled }
                        - { value: 2, generic: 0, descr: installed }
