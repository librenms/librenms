modules:
  os:
    version:
      - OPENWRT-MIB::openwrtSysVersion.0
      - 'NET-SNMP-EXTEND-MIB::nsExtendOutput1Line."distro"'
    version_regex: '/^(?:[A-Za-z]\S*\s+)?(?<version>\S.*)$/'
    hardware:
      - OPENWRT-MIB::openwrtSysModel.0
      - 'NET-SNMP-EXTEND-MIB::nsExtendOutput1Line."hardware"'
  sensors:
    fanspeed:
      data:
        - oid: LM-SENSORS-MIB::lmFanSensorsTable
          value: LM-SENSORS-MIB::lmFanSensorsValue
          num_oid: '.1.3.6.1.4.1.2021.13.16.3.1.3.{{ $index }}'
          descr: '{{ LM-SENSORS-MIB::lmFanSensorsDevice }}'
          group: LM-SENSORS
    temperature:
      data:
        - oid: LM-SENSORS-MIB::lmTempSensorsTable
          value: LM-SENSORS-MIB::lmTempSensorsValue
          divisor: 1000
          num_oid: '.1.3.6.1.4.1.2021.13.16.2.1.3.{{ $index }}'
          descr: '{{ LM-SENSORS-MIB::lmTempSensorsDevice }}'
          group: LM-SENSORS
