modules:
    os:
        # Kernel release from sysDescr, e.g. "6.1.0-50-amd64". The Debian
        # release itself is not exposed by this device - the "Debian x.y.z-n"
        # token in sysDescr is the kernel package version, not the distro
        # release.
        sysDescr_regex: '/^Linux \S+ (?<features>\S+)/'
        # net-snmp "extend" output (release_version.sh); no MIB defines this
        # private extend root, so the numeric OID is used directly.
        # Index is the extend name "APP_VERSION".
        version: .1.3.6.1.4.1.2021.102.2.3.1.1.11.65.80.80.95.86.69.82.83.73.79.78
