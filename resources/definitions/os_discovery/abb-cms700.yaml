# The CMS700 MIB defines every branch as its own scalar (e.g. CMS700::TRMSsens1..N)
# served without a .0 instance, so each sensor is listed explicitly.
# oid is the MIB root node so one walk fetches the value, branch name and phase
# for every entry; num_oid uses {{ $noindex }} because there is no instance index.
# Branches with an empty branch name are not wired up and are skipped.
modules:
    sensors:
        current:
            data:
                -
                    oid: CMS700::cms700
                    value: CMS700::TRMSsens1
                    num_oid: '.1.3.6.1.4.1.51055.1.1.1{{ $noindex }}'
                    index: 'TRMSsens.1'
                    descr: 'TRMSsens_1 {{ CMS700::BranchNamesens1 }} (L{{ CMS700::Phasesens1 }})'
