modules:
    os:
        sysDescr_regex: '/SEH (?<hardware>[^;]+); SN (?<serial>\S+), .* SW (?<version>\S+)/'
    sensors:
        state:
            data:
                # both tables are pre-populated by includes/discovery/sensors/pre-cache/seh-uds.inc.php
                # with one row per attached USB device (seh_usb_slot, seh_usb_tag, seh_usb_own, seh_usb_label)
                -
                    # SEH-PSRV-MIB 1.x: utnPortTable, utnPortSlot = .27, indexed <device>.0
                    oid: SEH-PSRV-MIB::utnPortTable
                    value: seh_usb_slot
                    num_oid: '.1.3.6.1.4.1.1229.2.50.2.1.27.{{ $index }}'
                    descr: 'Port {{ seh_usb_slot }}: {{ seh_usb_label }}'
                    group: USB Port
                    index: 'utnPortIndex.{{ $index }}'
                    state_name: utnPortUsbSlot
                    states:
                        - { value:  0, generic: 3, descr: no device }
                        - { value:  1, generic: 0, descr: connected }
                        - { value:  2, generic: 0, descr: connected }
                        - { value:  3, generic: 0, descr: connected }
                        - { value:  4, generic: 0, descr: connected }
                        - { value:  5, generic: 0, descr: connected }
                        - { value:  6, generic: 0, descr: connected }
                        - { value:  7, generic: 0, descr: connected }
                        - { value:  8, generic: 0, descr: connected }
                        - { value:  9, generic: 0, descr: connected }
                        - { value: 10, generic: 0, descr: connected }
                        - { value: 11, generic: 0, descr: connected }
                        - { value: 12, generic: 0, descr: connected }
                        - { value: 13, generic: 0, descr: connected }
                        - { value: 14, generic: 0, descr: connected }
                        - { value: 15, generic: 0, descr: connected }
                        - { value: 16, generic: 0, descr: connected }
                        - { value: 17, generic: 0, descr: connected }
                        - { value: 18, generic: 0, descr: connected }
                        - { value: 19, generic: 0, descr: connected }
                        - { value: 20, generic: 0, descr: connected }
                -
                    # sehMIB 2.x: utnDevTable, utnDevPort = .8, indexed <device>
                    oid: SEH-PSRV-MIB::utnDevTable
                    value: seh_usb_slot
                    num_oid: '.1.3.6.1.4.1.1229.5.20.2.1.8.{{ $index }}'
                    descr: 'Port {{ seh_usb_slot }}: {{ seh_usb_label }}'
                    group: USB Port
                    index: 'utnDevIndex.{{ $index }}'
                    state_name: utnPortUsbSlot
                    states:
                        - { value:  0, generic: 3, descr: no device }
                        - { value:  1, generic: 0, descr: connected }
                        - { value:  2, generic: 0, descr: connected }
                        - { value:  3, generic: 0, descr: connected }
                        - { value:  4, generic: 0, descr: connected }
                        - { value:  5, generic: 0, descr: connected }
                        - { value:  6, generic: 0, descr: connected }
                        - { value:  7, generic: 0, descr: connected }
                        - { value:  8, generic: 0, descr: connected }
                        - { value:  9, generic: 0, descr: connected }
                        - { value: 10, generic: 0, descr: connected }
                        - { value: 11, generic: 0, descr: connected }
                        - { value: 12, generic: 0, descr: connected }
                        - { value: 13, generic: 0, descr: connected }
                        - { value: 14, generic: 0, descr: connected }
                        - { value: 15, generic: 0, descr: connected }
                        - { value: 16, generic: 0, descr: connected }
                        - { value: 17, generic: 0, descr: connected }
                        - { value: 18, generic: 0, descr: connected }
                        - { value: 19, generic: 0, descr: connected }
                        - { value: 20, generic: 0, descr: connected }
