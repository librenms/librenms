os: armis
text: 'Armis'
group: unix
type: server
icon: armis
over:
    - { graph: device_bits, text: 'Device Traffic' }
    - { graph: device_processor, text: 'CPU Usage' }
    - { graph: device_mempool, text: 'Memory Usage' }
discovery:
    -
        sysObjectID:
            - .1.3.6.1.4.1.8072.3.2.10
        snmpget:
            # net-snmp "extend" command path; no MIB defines this private
            # extend root. Index is the extend name "APP_VERSION".
            oid: .1.3.6.1.4.1.2021.102.2.2.1.2.11.65.80.80.95.86.69.82.83.73.79.78
            op: contains
            value: '/var/armis/'
