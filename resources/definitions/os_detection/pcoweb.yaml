os: pcoweb
text: 'Carel pCOWeb'
type: environment
mib_dir: carel
over:
    - { graph: device_temperature, text: Temperature }
    - { graph: device_humidity, text: Humidity }
icon: carel
icons:
    - uniflair
discovery:
    -
        sysDescr: 'pCO Gateway'
    -
        sysObjectID: .1.3.6.1.4.1.8072.3.2.10
        snmpget:
            oid: CAREL-ug40cdz-MIB::roomTemp.0
            mib_dir: carel
            op: '!='
            value: false
    -
        sysObjectID_regex: '/^\.1\.3\.6\.1\.4\.1$/'
        snmpget:
            oid: '.1.3.6.1.4.1.9839.1.2.0'
            op: '='
            value: '2'
