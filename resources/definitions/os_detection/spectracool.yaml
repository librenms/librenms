os: spectracool
group: nvent-hoffman
text: 'nVent SpectraCool'
type: environment
over:
    - { graph: device_temperature, text: 'Temperature' }
icon: nvent-hoffman
discovery:
    -
        sysObjectID:
            - .0.0
        sysDescr_regex:
            - '/^RTCS /'
        # Exclude Voltronic/OEM ATS (P97) RTCS cards
        snmpget_except:
            oid: .1.3.6.1.4.1.21111.1.4.1.2.0
            op: '='
            value: '97'
