os: ibmtl
text: 'IBM Tape Library'
type: storage
icon: ibmos
mib_dir: ibm
over:
    - { graph: device_bits, text: Traffic }
discovery:
    -
        sysObjectID: .1.3.6.1.4.1.14851
        snmpget:
            oid: 'SML-MIB::product-Name.0'
            value: 'IBM System Storage TS3500 Tape Library'
    -
        sysObjectID:
            - .1.3.6.1.4.1.2.6.210
    - sysDescr_regex:
        - '/IBM (.*) UltraScaleable Tape Library/'
    -
        sysObjectID_regex:
            - '/^$/'
        snmpget:
            oid: 'SNIA-SML-MIB::storageLibrary-Description.0'
            value: 'IBM TS4300'

