os: openwrt
text: OpenWrt
type: network
icon: openwrt
over:
    - { graph: device_bits, text: 'Device Traffic' }
    - { graph: device_processor, text: 'CPU Usage' }
    - { graph: device_mempool, text: 'Memory Usage' }
discovery:
    -
        # Free fast path: matches whenever the hostname was left at its default
        # "OpenWrt", which is common enough to be worth trying first - avoids the
        # snmpget below entirely for those devices. Falls through to it otherwise
        # (a renamed device, e.g. openwrt_glinet fixture, sysDescr: "Linux ap2 ...").
        sysObjectID: .1.3.6.1.4.1.8072.3.2.10
        sysDescr: OpenWrt
    -
        sysObjectID: .1.3.6.1.4.1.8072.3.2.10
        snmpget:
            oid: 'NET-SNMP-EXTEND-MIB::nsExtendOutput1Line."distro"'
            # 'contains' not 'starts': GL.iNet firmware's distro extend wrapped the value in
            # decorative characters in one capture - a BE9300 returned \\---OpenWrt---// - so
            # it did not begin with "OpenWrt" and an anchored match missed it. 'contains'
            # handles both that decorated form and a plain "OpenWrt ..." string. See the
            # openwrt_glinet fixture.
            op: contains
            value: OpenWrt
