os: grandstream-ucm
group: grandstream
text: 'Grandstream UCM63xx'
type: appliance
icon: grandstream
over:
    - { graph: device_processor, text: 'CPU Usage' }
    - { graph: device_mempool, text: 'Memory Usage' }
    - { graph: device_percent, text: 'Disk Usage' }
    - { graph: device_count, text: 'Calls' }
mib_dir: grandstream
discovery:
    -
        sysObjectID: .1.3.6.1.4.1.8072.3.2.10
        sysDescr_regex: '/^Linux UCM63\d{2}A?\b/'
