os: netbsd
type: server
group: unix
text: NetBSD
processor_stacked: true
over:
    - { graph: device_processor, text: 'Processor Usage' }
    - { graph: device_mempool, text: 'Memory Usage' }
poller_modules:
    entity-state: true
discovery_modules:
    entity-state: true
discovery:
    -
        sysDescr_regex:
            - '/^NetBSD/'
