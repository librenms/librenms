os: liebert-icom
text: Liebert iCOM
type: environment
icon: vertiv
snmp_bulk: false
mib_dir: liebert
rfc1628_compat: true
discovery:
    -
        sysObjectID:
            - .1.3.6.1.4.1.476.1.42
        snmpget:
            oid: .1.3.6.1.4.1.476.1.42.2.4.2.1.2.1
            op: 'regex'
            value: '/476\.1\.42\.4\.3\.6$/'
over:
    - { graph: device_temperature, text: 'Temperature' }
    - { graph: device_humidity, text: 'Humidity' }
    - { graph: device_percent, text: 'Capacity Usage' }
